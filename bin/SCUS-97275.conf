# SOCOM II: U.S. Navy SEALs (SCUS-97275)
#
# Read by remix_ps2::materials at frame boundaries and pushed through
# remixapi_SetConfigVariable, which writes Remix's *user* layer and therefore outranks rtx.conf
# and any Logic-graph layer. An existing environment variable always beats this file, so A/B
# harnesses stay authoritative.
#
# PROVENANCE: created 2026-08-15 to carry the "flickering triangles" fix across from
# SOCOM: Combined Assault (SCUS-97545.conf). SOCOM II is the same Zipper Interactive engine
# family, so the mechanism is expected to transfer -- but NOTHING BELOW HAS BEEN MEASURED ON
# THIS TITLE. Every number here was measured on Combined Assault. Treat this as a starting
# hypothesis and confirm against this game's own counters before quoting any of it as fact.
#
# There is deliberately no gamesettings overlay for this serial. Do NOT open the Remix settings
# page while SOCOM II is loaded -- doing so serialises the whole GUI knob state into
# gamesettings\SCUS-97275_<hash>.ini, which reaches the backend through the environment BEFORE
# this file is read, and every line here then logs as "SKIPPED (already set in the environment)".
# That is how this project has silently re-broken its own config twice.


# ---------------------------------------------------------------------------------------------
# THE TRIANGLE FIX: hold the previous batch on an empty present window.
#
# Symptom on Combined Assault, in the user's words: "the triangles are flickering, almost like
# z fighting". It is NOT depth precision and no depth work should be aimed at it.
#
# Mechanism: the game renders at ~40 fps while the backend presents every vsync at 60, so every
# third presented window submits ZERO geometry (measured on CA: 57 of 171 windows, spacing
# exactly 3 in 56 of 56). Presenting an empty scene is what produces the "shattered" frame --
# the world appears to explode into spikes for one frame in three.
#
# The discriminator that settled it was exposure-invariant NCC, not luma: clean-to-clean frames
# scored 0.94-0.99, shattered-to-shattered only 0.12-0.43 -- the bad frames do not correlate
# with EACH OTHER, which rules out a tonemapper oscillation. The blown-out look (saturation 4%
# -> 17-50%) is a consequence of the shards catching the key light, not the fault itself.
#
# Measured on CA after the fix: period-3 luma signature gone (all three phases at mean
# 12.9/13.0/13.0, where the broken clip had one phase blown to 108-183), peak saturation
# 50% -> 9.5%. Counters read: empty windows 2754 held 2374 | gap3 2368 offcadence 5.
#
# Mode 1 re-draws the previous window's batch, at most once in a row. Mode 2 additionally
# re-submits the PREVIOUS camera, making the held frame a true duplicate rather than last
# frame's geometry seen from this frame's eye -- that residual was measured on CA as runs of
# near-zero inter-frame delta (0.02-0.05) through a turn. Combined Assault currently runs 2,
# so that is what is transplanted here.
#
# THE JUDDER FLOOR IS NOT OURS. If SOCOM II is also natively 40 fps, 40 frames into 60 presented
# windows cannot pace evenly and some judder remains in every mode. Do not read residual judder
# as this fix failing.
#
# Mode 3 skips presenting the empty window entirely, so the present rate becomes the game's
# native rate -- only meaningful on a VRR display, and NOT runtime-tested on any title. This
# engine has a GPU-hang history. Start at 2; drop to 1 if the held camera looks wrong; only try
# 3 deliberately, and come straight back if emulation speed or audio pitch shifts.
#
# HOW TO TELL IT WORKED ON THIS TITLE, rather than assuming: read the empty/held/gap3 counters.
# If "empty windows" is ~0, SOCOM II does not have the 40-into-60 problem and this knob is inert
# here -- in which case the flicker (if any) is a DIFFERENT fault and this line is not the fix.
PCSX2_REMIX_HOLDEMPTY = 2

# Keep dynamic batch meshes alive while Remix finishes its asynchronous ray-tracing build.
# On Combined Assault three frames produced VK_ERROR_DEVICE_LOST on camera turns; 16 is the
# value that title settled on. Carried across because HOLDEMPTY re-draws a previous batch and
# therefore depends on that batch still being alive -- the two knobs are coupled, so shipping
# HOLDEMPTY without this is not a safe transplant.
PCSX2_REMIX_BATCHRETAIN = 16


# ---------------------------------------------------------------------------------------------
# GEOMETRY SCATTER: gate off-screen render-to-texture passes.
#
# Separate fault from the flicker above, also transplanted from Combined Assault, also unmeasured
# on SOCOM II.
#
# On CA the game draws into TWO targets: the 640x448 main framebuffer takes 1,859 of 1,867 dumped
# draws, and a 128x128 target takes the other 8. Every draw caught by FARDUMP=25000 was in that
# second group -- unanimous on six independent fields (rt=128x128, sky=1, fbmsk=0x00ffffff,
# untextured material, ZTST=1, tex psm=0x00).
#
# It is a render-to-texture pass, so un-projecting it with the MAIN camera is meaningless. One
# such draw covers 62x75 pixels on screen and comes out with a world extent of 115,012 units and
# a w range of 0.0156..72,812 WITHIN THE SINGLE DRAW. Two or three per frame is enough to shatter
# the scene.
#
# MEASURED on CA, same save state, ~1,800 frames per arm:
#                       maxpos     scene r    degen tris    sky    gated
#   MINRT=0 (control)   151,966    11,800     1,657,536     2,867      0
#   MINRT=50             14,613    11,643     1,350,414         0  2,758
#
# maxpos drops 10x and lands INSIDE the scene's own radius instead of ten times outside it.
#
# THIS IS AN AREA IN PIXELS, NOT A PERCENTAGE. The original percentage form is what caused the
# "geometry disappearing again" regression: it was measured against the largest target seen so
# far, a reference that only ever grows, so one larger target anywhere in the session moved it
# permanently -- at 50%, a 1024-wide target put the cutoff at 512, above the main framebuffer's
# 448 height, and the ENTIRE world was culled from then on. An area has no such ordering
# dependence: 128x128 = 16,384 is rejected by any threshold that keeps 640x448 = 286,720.
#
# THE ONE THING TO CHECK ON THIS TITLE: 65,536 is a 256x256 equivalent, so it is only safe if
# SOCOM II's main framebuffer area exceeds it. 640x448 = 286,720 and 512x224 = 114,688 both
# clear it comfortably, but a low-res mode such as 256x224 = 57,344 would be culled outright and
# the whole world would vanish. If geometry disappears entirely, this line is the first suspect --
# read the actual target dimensions from a draw dump before adjusting rather than guessing a
# lower number.
#
# Note the CA arm also took sky 2,867 -> 0, because on that title every sky-classified draw WAS
# one of these passes. Do not assume that generalises here; if SOCOM II classifies sky on the
# main target, this knob will not touch it.
PCSX2_REMIX_MINRT = 65536

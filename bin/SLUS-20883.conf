# Tom Clancy's Rainbow Six 3 (SLUS-20883)
#
# Read by remix_ps2::materials at frame boundaries and pushed through
# remixapi_SetConfigVariable, which writes Remix's *user* layer and therefore outranks rtx.conf and
# any Logic-graph layer. Keys spelled PCSX2_REMIX_* set our own toggles instead. An existing
# environment variable always beats this file, so A/B harnesses stay authoritative.

# ---------------------------------------------------------------------------------------------
# LIGHTMAPS -- discovered automatically, warehouse test state (slot 9)
# ---------------------------------------------------------------------------------------------
#
# This title has NO RUNTIME LIGHTS AT ALL. Its entire lighting is baked into these textures, and
# until now 100% of it was being discarded and replaced with one injected distant fill light --
# which is why the weapon blows out white while walls stay flat.
#
# R6 3 encodes a full-colour lightmap as ONE PSMT8 index texture plus THREE CLUTs, one per colour
# channel, and modulates it in with three draws that each write a single channel (FBMSK bits set =
# protected). It does this because the PS2 blend equation (A-B)*C+D takes C from an ALPHA source
# and therefore cannot multiply by per-channel colour -- moving one channel into alpha via the CLUT
# is the only way with a single texture unit. This is a hardware constraint, not a quirk.
#
# MEASURED on slot 9, generated into logs\remix_lightmaps.txt by PCSX2_REMIX_LIGHTMAPS (default 1):
#
#   hash                 tbp0    cbp     psm   size      channel mask  draws
#   0x0EB509E735CC3C23   0x2ef4  0x3f63  0x13  256x256   0xff00ffff    540   Blue
#   0x009606FBB548BF93   0x2ef4  0x3f6a  0x13  256x256   0xffff00ff    540   Green
#   0x0F776E5635D3BADD   0x2ef4  0x3f71  0x13  256x256   0xffffff00    540   Red
#   0x3B8DC5923081F9A1   0x319c  0x3f7f  0x13  256x256   0xff00ffff    120   Blue
#   0x2FE01002AEBA8CDC   0x319c  0x3f86  0x13  256x256   0xffff00ff    120   Green
#   0x593F775A61F7F4C8   0x319c  0x3f8d  0x13  256x256   0xffffff00    120   Red
#
# Two lightmaps (pages 0x2ef4 and 0x319c), CLUTs spaced exactly 7 blocks apart in both groups, and
# the draw counts are exact thirds with no stragglers -- the channel-triple structure holds with
# zero exceptions across 1,980 masked draws.
#
# Other levels will have different hashes. Re-run with the game loaded and read
# logs\remix_lightmaps.txt; discovery is on by default and costs nothing (it hashes a source that
# is already resident and uploads nothing).

# ---------------------------------------------------------------------------------------------
# NOT YET ACTIVE, and the reason is worth stating rather than discovering later
# ---------------------------------------------------------------------------------------------
#
# Tagging these emissive would do NOTHING today. The masked draws are rejected by the FBMSK gate
# before materials::bind() runs, so these textures are never created as Remix materials and no hash
# list can match them. That is exactly why their hashes had never been computed before now.
#
# It would also be the wrong shape even once they are submitted. A lightmap MODULATES the surface
# it covers (Cd * As); making the lightmap texture itself emissive would hang a glowing sheet in
# front of the wall rather than lighting the wall. The correct fold-in reconstructs one RGB texture
# from the three CLUTs and attaches it to the BASE surface's material.
#
# ---------------------------------------------------------------------------------------------
# INJECTION -- increment 1
# ---------------------------------------------------------------------------------------------
#
# PCSX2_REMIX_LIGHTMAPINJECT=1 stops rejecting the masked passes and submits them as
# DECAL_STATIC + IGNORE_BAKED_LIGHTING instances. The decal category is the load-bearing part:
# submitting them as ordinary geometry is what originally put four coincident surfaces on every wall
# and z-fought in the path tracer, and a decal is precisely what a renderer offsets to sit on a
# surface without fighting it. These are static by construction, being baked lighting.
#
# Tagging the six hashes emissive below makes bind() build them with emissiveTexture set, so no new
# material code is needed for this increment.
#
# KNOWN LIMITATION of increment 1: emissiveColorConstant is {1,1,1}, so each of the three channel
# passes emits WHITE times its own greyscale channel and the three sum to grey. The light will be in
# roughly the right places with roughly the right intensity, but not the right colour. Increment 2
# sets emissiveColorConstant per channel from the FBMSK to recover it.
PCSX2_REMIX_LIGHTMAPINJECT = 0

# NOTE the key name: pcsx2.emissiveTextures, not rtx.emissiveTextures. Remix has no emissive
# texture list of its own, so this one is ours and is read by refresh_categories rather than pushed
# through SetConfigVariable. Using the rtx.* spelling makes the loader try to push it to Remix,
# which rejects it -- that shows up as "1 failed" in the per-game config line and the hashes are
# silently never tagged.
# Disabled with injection -- see below.
# pcsx2.emissiveTextures = 0x0EB509E735CC3C23, 0x009606FBB548BF93, 0x0F776E5635D3BADD, 0x3B8DC5923081F9A1, 0x2FE01002AEBA8CDC, 0x593F775A61F7F4C8

# Remix injects its OWN fallback light when the level has no lights, and this title has none.
# That is the bright light blowing out the weapon -- KEY=0 still measured mean_lum 78.5, so it was
# never ours. 0 = never inject it.
rtx.fallbackLightMode = 0


# With Remix's fallback light gone, our own key is the only light until lightmap injection lands.
# 100 (the default) blows the frame and crushes texture detail to white; 25 measured mean_sat 0.094
# and 31.26% coloured pixels, the best on this title. Tune to taste -- you can see it, I cannot.
PCSX2_REMIX_KEY = 25


# Tom Clancy's Rainbow Six 3 (SLUS-20883)
#
# Read by remix_ps2::materials at frame boundaries and pushed through
# remixapi_SetConfigVariable, which writes Remix's *user* layer and therefore outranks rtx.conf and
# any Logic-graph layer. Keys spelled PCSX2_REMIX_* set our own toggles instead. An existing
# environment variable always beats this file, so A/B harnesses stay authoritative.

# ---------------------------------------------------------------------------------------------
# WHY EVERY CONTESTED KEY IS PINNED IN THIS FILE
# ---------------------------------------------------------------------------------------------
#
# The PCSX2 per-game settings overlay (gamesettings\SLUS-20883_21CC1EC3.ini, section [Remix])
# re-serialises ITSELF on every visit to the Remix settings tab, and it reaches the backend through
# the process environment before this file is read. Stripping it once is not a fix -- it grows back.
#
# The counter-mechanism is proven in the 2026-08-24 08:45 session log. paths::apply_title_env
# (RemixPaths.cpp:244-263) skips only keys set by an EXTERNAL process, so a conf row overwrites an
# overlay-delivered value at boot:
#
#   [    6.8455] Remix: PCSX2_REMIX_LIGHTMAPINJECT = 1 (PCSX2 GUI)        <- overlay, early
#   [   11.6636] Remix: PCSX2_REMIX_LIGHTMAPINJECT = 0 (per-game conf)    <- this file wins
#
# So: pin the value here, and read the per-boot proof line
#
#   Remix: effective LIGHTMODE=.. [..] .. SKY=.. [..] .. RTTEX=.. [..] UIMODE=.. [..] ..
#
# (RemixMaterials.cpp:1527-1551). EVERY pinned key must read [per-game conf]. A [PCSX2 GUI] source
# there means the overlay won that boot -- stay off the Remix settings tab, or re-save this file
# (an mtime change re-applies it) to take the key back.
#
# The 2026-08-24 session booted with LIGHTMODE=2 / SKY=3 / TEXSTAGE=0 / LIGHTMAPINJECT=1 pushed
# from the overlay. That is the blown-out, HUD-less, sky-in-your-face frame the user reported.
#
# LATCHED ACCESSORS ARE STILL DELIVERABLE FROM HERE ON THIS TITLE -- but only because the latch
# happens late. ALPHASTATE (RemixSubmit.cpp:7037), RTTEX (RemixMaterials.cpp:190) and SKYCAM
# (RemixSubmit.cpp:2568) are `static const`, i.e. first-use latches. Measured in the same log: this
# file applies at 11.6638 s and the first latch fires at 25.3408 s
# ("Remix: ALPHASTATE = 2 -- ..."), because nothing binds a texture until the game is actually
# rendering. SCANKICKS is the exception and genuinely cannot live here -- see its block below.

# ---------------------------------------------------------------------------------------------
# LIGHTMAPS -- discovered automatically, warehouse test state (slot 9)
# ---------------------------------------------------------------------------------------------
#
# This title has NO RUNTIME LIGHTS AT ALL. Its entire lighting is baked into these textures, and
# until now 100% of it was being discarded and replaced with one injected distant fill light --
# which is why the weapon blows out white while walls stay flat.
#
# R6 3 encodes a full-colour lightmap as ONE PSMT8 index texture plus THREE CLUTs, one per colour
# channel, and modulates it in with three draws that each write a single channel (FBMSK bits set =
# protected). It does this because the PS2 blend equation (A-B)*C+D takes C from an ALPHA source
# and therefore cannot multiply by per-channel colour -- moving one channel into alpha via the CLUT
# is the only way with a single texture unit. This is a hardware constraint, not a quirk.
#
# MEASURED on slot 9, generated into logs\remix_lightmaps.txt by PCSX2_REMIX_LIGHTMAPS (default 1):
#
#   hash                 tbp0    cbp     psm   size      channel mask  draws
#   0x0EB509E735CC3C23   0x2ef4  0x3f63  0x13  256x256   0xff00ffff    540   Blue
#   0x009606FBB548BF93   0x2ef4  0x3f6a  0x13  256x256   0xffff00ff    540   Green
#   0x0F776E5635D3BADD   0x2ef4  0x3f71  0x13  256x256   0xffffff00    540   Red
#   0x3B8DC5923081F9A1   0x319c  0x3f7f  0x13  256x256   0xff00ffff    120   Blue
#   0x2FE01002AEBA8CDC   0x319c  0x3f86  0x13  256x256   0xffff00ff    120   Green
#   0x593F775A61F7F4C8   0x319c  0x3f8d  0x13  256x256   0xffffff00    120   Red
#
# Two lightmaps (pages 0x2ef4 and 0x319c), CLUTs spaced exactly 7 blocks apart in both groups, and
# the draw counts are exact thirds with no stragglers -- the channel-triple structure holds with
# zero exceptions across 1,980 masked draws.
#
# Other levels will have different hashes. Re-run with the game loaded and read
# logs\remix_lightmaps.txt; discovery is on by default and costs nothing (it hashes a source that
# is already resident and uploads nothing).

# ---------------------------------------------------------------------------------------------
# NOT YET ACTIVE, and the reason is worth stating rather than discovering later
# ---------------------------------------------------------------------------------------------
#
# Tagging these emissive would do NOTHING today. The masked draws are rejected by the FBMSK gate
# before materials::bind() runs, so these textures are never created as Remix materials and no hash
# list can match them. That is exactly why their hashes had never been computed before now.
#
# It would also be the wrong shape even once they are submitted. A lightmap MODULATES the surface
# it covers (Cd * As); making the lightmap texture itself emissive would hang a glowing sheet in
# front of the wall rather than lighting the wall. The correct fold-in reconstructs one RGB texture
# from the three CLUTs and attaches it to the BASE surface's material.
#
# ---------------------------------------------------------------------------------------------
# INJECTION -- increment 1
# ---------------------------------------------------------------------------------------------
#
# PCSX2_REMIX_LIGHTMAPINJECT=1 stops rejecting the masked passes and submits them as
# DECAL_STATIC + IGNORE_BAKED_LIGHTING instances. The decal category is the load-bearing part:
# submitting them as ordinary geometry is what originally put four coincident surfaces on every wall
# and z-fought in the path tracer, and a decal is precisely what a renderer offsets to sit on a
# surface without fighting it. These are static by construction, being baked lighting.
#
# Tagging the six hashes emissive below makes bind() build them with emissiveTexture set, so no new
# material code is needed for this increment.
#
# KNOWN LIMITATION of increment 1: emissiveColorConstant is {1,1,1}, so each of the three channel
# passes emits WHITE times its own greyscale channel and the three sum to grey. The light will be in
# roughly the right places with roughly the right intensity, but not the right colour. Increment 2
# sets emissiveColorConstant per channel from the FBMSK to recover it.
#
# STAYS 0. Increment 1 was tried and rendered BLACK FLICKERING SQUARES; it was reverted. The
# overlay pushed LIGHTMAPINJECT = 1 into the 2026-08-24 session (emulog 6.8455 s) and this row is
# what took it back (11.6636 s). Do not raise it without a new plan for the black squares.
PCSX2_REMIX_LIGHTMAPINJECT = 0

# NOTE the key name: pcsx2.emissiveTextures, not rtx.emissiveTextures. Remix has no emissive
# texture list of its own, so this one is ours and is read by refresh_categories rather than pushed
# through SetConfigVariable. Using the rtx.* spelling makes the loader try to push it to Remix,
# which rejects it -- that shows up as "1 failed" in the per-game config line and the hashes are
# silently never tagged.
# Disabled with injection -- see below.
# pcsx2.emissiveTextures = 0x0EB509E735CC3C23, 0x009606FBB548BF93, 0x0F776E5635D3BADD, 0x3B8DC5923081F9A1, 0x2FE01002AEBA8CDC, 0x593F775A61F7F4C8

# ---------------------------------------------------------------------------------------------
# LIGHTING -- one distant key, nothing that can follow the camera
# ---------------------------------------------------------------------------------------------
#
# Remix injects its OWN fallback light when the level has no lights, and this title has none.
# That is the bright light blowing out the weapon -- KEY=0 still measured mean_lum 78.5, so it was
# never ours. 0 = never inject it.
# 2026-08-08: was 0 (Never). This file is pushed through remixapi_SetConfigVariable at every
# frame boundary and lands in Remix's USER layer, which outranks all three rtx.conf layers --
# so a 0 here silently reverted the developer menu's fallback-light toggle within one frame,
# every frame. That is why it "kept getting set to never".
#
# 1 = inject only when the level has no lights of its own. R6 3 has none at all (its lighting
# is entirely baked into lightmaps), so this is always on for this title.
rtx.fallbackLightMode = 1

# Distant, explicitly. Distant is a world-space direction and does NOT move with the view;
# Sphere is placed at mainCamera.getPosition() every frame (rtx_light_manager.cpp:310) and
# enableFallbackLightViewPrimaryAxis aims its cone down mainCamera.getDirection() -- those are
# the two settings that make a fallback light follow the camera. Pinned so neither can creep in.
rtx.fallbackLightType = 0
rtx.fallbackLightDirection = -0.2, -1.0, 0.4
rtx.fallbackLightAngle = 5.0

# LIGHTMODE 1 = our own distant fill key, and nothing else.
#
# THE BLOWN-OUT FRAME HAD A NAMED CAUSE. The 2026-08-24 session booted LIGHTMODE = 2 from the
# settings overlay (emulog 6.8454 s). Mode 2 places a SPHERE LIGHT AT THE CAMERA
# (place_debug_light) plus a distant light down the view axis (place_sun_light), and makes
# place_fill_lights() return early -- so it is both an overexposure and, by construction, a light
# that follows you. Pinned to 1 here so the overlay cannot re-deliver it.
PCSX2_REMIX_LIGHTMODE = 1

# With Remix's fallback light gone, our own key is the only light until lightmap injection lands.
# 100 (the default) blows the frame and crushes texture detail to white; 25 measured mean_sat 0.094
# and 31.26% coloured pixels, the best on this title. Tune to taste -- you can see it, I cannot.
#
# WHAT 0 ACTUALLY DOES, since this is easy to get wrong in both directions. There are TWO float
# readers in this file's neighbourhood and they disagree about zero:
#
#   env_float        (RemixSubmit.cpp:2457-2465)  rejects <= 0 and returns the FALLBACK
#   env_float_signed (RemixSubmit.cpp:931-939)    accepts 0 and returns it
#
# key_radiance() uses the SIGNED one (:1058), so on this build KEY = 0 really is "no key light",
# not a silent 100. The deployed copy of this file carried KEY = 0 until 2026-08-24 and was
# therefore running with our fill light OFF -- so the blown-out frame the user reported was NOT
# ours; it was LIGHTMODE = 2 from the settings overlay. Knobs that go through env_float
# (NEARPLANE, and anything else using it) DO have the "0 means default" trap -- check which reader
# a knob uses before writing 0 for "off".
PCSX2_REMIX_KEY = 25



# ---------------------------------------------------------------------------------------------
# SCANKICKS BELONGS IN THE SETTINGS OVERLAY, NOT IN THIS FILE
# ---------------------------------------------------------------------------------------------
#
# PCSX2_REMIX_SCANKICKS caps how many XGKICKs per frame the camera scan examines. Default 16,
# against ~1,230 kicks per frame on R6 3 -- so 1.3% of the frame is sampled, and on save state 7
# the camera is usually not at the pinned address during that slice. Measured, five 30 s runs per
# arm, world-anchored share of frames on state 7:
#
#   SCANKICKS = 16 (default)   25.3  27.4  27.5  28.9  50.3   median 27.5
#   SCANKICKS = 4096           0.0   62.0  64.9  64.9  66.2   median 64.9
#
# Four of five runs land in a four-point band, against a default arm clustered at 25-29. Frame
# count is unchanged either way (1380-1560 over 30 s), so the 81x extra scanning costs ~4%.
# State 9 re-checked at 4096: cam world 1258 fallback 2, i.e. 99.84%, unchanged.
#
# It cannot be set here. This file is read by refresh_game_config() at a frame boundary, but
# SCANKICKS is latched once in SetArmed() before that runs (RemixVU1Capture.cpp:53). The PCSX2
# per-game settings overlay (gamesettings\SLUS-20883_21CC1EC3.ini, section [Remix]) reaches the
# process environment before the runtime loads, which is early enough. It is the ONLY row that
# section is allowed to keep:
#
#   [Remix]
#   SCANKICKS = 4096

# ---------------------------------------------------------------------------------------------
# SKY BY TEXTURE HASH -- exact, and immune to draw order
# ---------------------------------------------------------------------------------------------
#
# The "first N draws" rule is fragile on this title because the leading draws are structurally
# identical -- 2-9 triangles, same screen coverage -- so the cut between backdrop and world is
# invisible to it. Measured on save state 7 the w range separates them cleanly instead:
#
#   d=0  21v  9t  2520x1431 px  w [0.0154, 0.529]  tbp0=0x3ae8  mat 8A5CE8DF66AF2637  <- backdrop
#   d=1  44v 29t   730x702  px  w [0.138 , 0.529]  tbp0=0x3b3d  mat 7F3BA2CE2A589C55  <- sun/moon
#   d=2   5v  3t   115x334  px  w [2.300 , 4.199]  tbp0=0x2da0                        <- WORLD
#
# 2026-08-24, ALCATRAZ, logs\remix_draws.txt f=11090 d=0: mat 8A5CE8DF66AF2637, 50 verts,
# w [0.0192, 0.489], px 3100x1875 (fullscreen), depth(r=1 w=1). THE BACKDROP HASH IS THE SAME
# TEXTURE ON BOTH LEVELS. The "hashes are per-level so Alcatraz almost certainly will not match"
# worry is refuted for the backdrop specifically.
#
# EVERY GEOMETRIC SKY MODE MIS-FIRES ON THIS TITLE, which is the whole reason classification moves
# to the hash list. The backdrop draws with depth READ AND WRITE ON (r=1 w=1), and it sits NEARER
# than the world, not further:
#
#   mode 1  requires a depth-neutral draw          (RemixSubmit.cpp:7402-7403)  -- fails, w=1
#   mode 3  requires "samples an RT + no depth write" (:7364)                   -- fails, not an RT
#   mode 4  SKYMINW is a FAR floor                 (:7330-7332, :7383)          -- fails, w <= 0.49
#   mode 2  pure ordinal                           (:7395)                      -- MIS-TAGS:
#           in the 2026-08-24 dump the only sky=1 draws are f=11090-11093 d=0 (the backdrop,
#           correct) AND d=1 (mat C6D48D406868B228, 5 verts, 34x75 px -- a small WORLD draw).
#
# So the geometric classifier is switched off and the hash tags below carry the whole job.
PCSX2_REMIX_SKY = 0
PCSX2_REMIX_SKYORDER = 0

# The translation-stripped sky camera. Default 1, pinned because the overlay writes this key too.
# Latched (RemixSubmit.cpp:2568) but latched late -- see the header block.
PCSX2_REMIX_SKYCAM = 1

# Tagging by hash is better than any ordinal or geometric rule because it does not depend on order
# or on depth state at all. rtx.skyBoxTextures maps to REMIXAPI_INSTANCE_CATEGORY_BIT_SKY in our
# own category table (RemixMaterials.cpp:334-379), and this per-game conf IS a category layer --
# it is parsed directly by conf_paths (RemixMaterials.cpp:504-541), last and winning. No dev-menu
# action is needed to make these take effect.
#
# RESTORED 2026-08-24. It had been commented out with the note "the most recent R6 session recorded
# no hits for these hashes"; the Alcatraz dump above shows the first hash present and fullscreen,
# so the tag was simply not loaded. Confirm from the boot log:
#
#   Remix:   tag 8A5CE8DF66AF2637 -> categoryFlags 0x...
#
# Do NOT use the aggregate "tags N hits M" counter as the criterion -- the view-model tag matches
# the weapon on every frame and already read hits 17,653 in the 2026-08-24 session with the sky
# tag absent entirely.
#
# REFRESH PROCEDURE (content hashes are per-level in principle): set PCSX2_REMIX_DRAWDUMP = 6 in
# THIS file while standing in the level -- it is live-read, and saving the file re-arms it -- then
# take the mat= value of the leading fullscreen small-w draw in logs\remix_draws.txt and put it
# here. Set DRAWDUMP back to 0 afterwards.
rtx.skyBoxTextures = 0x8A5CE8DF66AF2637, 0x7F3BA2CE2A589C55

# ---------------------------------------------------------------------------------------------
# RENDER-TARGET SOURCES
# ---------------------------------------------------------------------------------------------
#
# PCSX2_REMIX_RTTEX = frames between refreshes of a render-target source's snapshot, 0 = off.
# bind() otherwise refuses an RT source a material outright (RemixMaterials.cpp:1816-1840) and the
# draw submits untextured -- and an untextured BLENDED draw renders solid white.
#
# READ THIS BEFORE EXPECTING IT TO DO ANYTHING ON R6 3. The snapshot is gated twice, and the outer
# gate is not this knob:
#
#   RemixSubmit.cpp:10601   const bool allow_render_target_snapshot = sky_draw;
#   RemixMaterials.cpp:1829 if (is_render_target && !allow_render_target_snapshot) { skip; }
#
# i.e. ONLY a draw already classified as sky is allowed a snapshot. R6 3's only target=1 draws are
# the Alcatraz projected-shadow decals (tbp0=0x3740), and all 12 of them in the 2026-08-24 dump
# read `world=1 sky=0`. So RTTEX cannot give those decals a material as things stand -- expect
# `rt snapshots 0` and `skip: target` to keep climbing on this title.
#
# Kept at 1 anyway: it is the settled SOCOM value, it costs nothing here (no R6 3 draw currently
# reaches the inner gate), and it is correct in advance for any level whose sky IS a render target.
# The white shadow bodies need the blend fix (to_d3d_blend has no A==B case -- see below), not this.
PCSX2_REMIX_RTTEX = 1

# ---------------------------------------------------------------------------------------------
# HUD AND MENUS -- the 2D overlay compositor
# ---------------------------------------------------------------------------------------------
#
# The R6 3 HUD is not "missing", it is shredded across four rejection paths, none of which
# composites it. Measured in the 2026-08-24 session (322 s, 553,405 binds):
#
#   skip: fst   47,003   HUD glyphs are FST=1 draws -- e.g. f=802 d=34/35, 6x5 px, w=[1,1],
#                        depth(r0 w0). NOTE: SOCOM had ZERO FST draws, so that title's HUD
#                        finding did not transfer and had to be re-measured here.
#   constq          72
#   wflat        1,897
#   plus w=[1,1] textured quads that leak into the world (f=802 d=0, 119x102 px at w=1)
#
#   overlay 0x0 | screen-ui seen 17,825 ... raster draws 0 ... presents 0 | uiraster 0 uimode 0
#
# The classifier was SEEING UI candidates all session; the rasteriser was simply off. The runtime
# supports the compositor -- the same log prints
# "fork features available (CreateTexture/CreateMaterial/DrawScreenOverlay)" at 11.6611 s.
#
# UIMODE 1   treat a 2D draw as screen UI whatever the camera is doing (RemixSubmit.cpp:696-716).
#            At 0, fallback_screen_ui only opens when NO world camera is latched -- so in a menu,
#            where the last gameplay camera is still valid, the const-Q gate eats every 2D draw.
#            That is the menu mechanism, named in the code's own comment.
# UIRASTER 1 rasterise those draws into a BGRA buffer and hand it to remixapi_DrawScreenOverlay
#            once per frame (:11616-11621).
PCSX2_REMIX_UIMODE = 1
PCSX2_REMIX_UIRASTER = 1

# UIWMAX separates real screen UI from world-space billboards: a draw is eligible only while
# max_w <= this (RemixSubmit.cpp:874, gate at :10619).
#
# 2 on this title, NOT SOCOM's 50. R6 3's genuine UI sits at w = 1.0 exactly (2026-08-24 dump,
# f=802 d=0/16/34/35), and the whole title lives in a tight w range -- the session histogram puts
# 550k of 553k draws under w = 10 -- so a ceiling of 50 would swallow world billboards wholesale.
# The view model (w 0.011-0.18) is not flat-2D and cannot be caught by this test by construction.
# RESIDUAL RISK: a near flat billboard (muzzle flash) at w < 2 rasterised into the HUD. The tell is
# a MOONCAND line in the log (:10621) or effects visibly vanishing; the knob is live, so retune
# from a fresh dump rather than rebuilding.
PCSX2_REMIX_UIWMAX = 2

# ---------------------------------------------------------------------------------------------
# DEFENSIVE PINS -- keys the settings overlay has written, held at their correct values
# ---------------------------------------------------------------------------------------------
#
# TEXSTAGE 1 (backend default, live): texture-stage colour ops on. The overlay pushed 0 into the
# 2026-08-24 session. Measured on this title, colour carried by the texture-stage ops is 12.79% of
# draws against 3.72% without -- turning it off throws that away.
PCSX2_REMIX_TEXSTAGE = 1

# ALPHASTATE 2 (backend default, latched late): mode 2 is the ONLY mode that chains
# remixapi_InstanceInfoBlendEXT onto the instance, so at 0 every blended draw reaches Remix opaque
# and the untextured material's 4x4 white albedo composites as a solid white shard. The overlay
# pushed 3, which is out of range and clamps to 2 -- the right value by accident, pinned here so it
# is the right value on purpose. Confirm from "Remix: ALPHASTATE = 2 -- InstanceInfoBlendEXT ..."
PCSX2_REMIX_ALPHASTATE = 2

# DRAWDUMP 0 (live). The overlay left 4 armed, which is a stale diagnostic writing
# logs\remix_draws.txt every session. Raise to 6 only while standing in the scene you want
# evidence for -- saving this file re-arms it -- then put it back.
PCSX2_REMIX_DRAWDUMP = 0

# rtx.viewModel.enable defaults False in the runtime, so the view-model camera and the
# REMIXAPI_INSTANCE_CATEGORY_BIT_VIEW_MODEL routing do nothing without it.
rtx.viewModel.enable = True

# ---------------------------------------------------------------------------------------------
# VIEW MODEL -- first-person geometry, routed to REMIXAPI_CAMERA_TYPE_VIEW_MODEL
# ---------------------------------------------------------------------------------------------
#
# categoryToCameraType checks REMIXAPI_INSTANCE_CATEGORY_BIT_VIEW_MODEL (1 << 26) first and
# returns CameraType::ViewModel, which becomes prototype.cameraType (remix-plus-1.5.1). Needs
# rtx.viewModel.enable, set above.
#
# Measured on save state 7, the two draw groups that sit at the eye:
#
#   mat 0xFB81B95116A7C982   577 tris, 209x224 px, w [0.029, 0.179]   <- tagged
#   mat 0x554E544558545244     8 tris, 596x1111 px, w [0.0002, 2.181] <- NOT tagged, see below
#
# The second hash is ASCII "UNTEXTRD" -- it is the shared untextured-material sentinel, not a
# texture. Tagging it would route EVERY untextured draw in the game to the view-model camera.
# It is a large near-eye draw and may well be the third-person body, but it cannot be separated
# by content hash because it has no content. If that body needs handling it has to be classified
# some other way -- by its w range, or by rtx.playerModelBodyTextures once it has a real material.
#
# COSMETIC, DO NOT "FIX": this row always logs one `FAILED (GENERAL_FAILURE)` and the per-game
# config line always ends "1 failed". The loader both feeds the category parser (which works) and
# pushes the key to SetConfigVariable (which Remix rejects, because pcsx2.* is ours, not theirs).
pcsx2.viewModelTextures = 0xFB81B95116A7C982

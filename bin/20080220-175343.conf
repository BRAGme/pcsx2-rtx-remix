# PS2 BIOS (OSDSYS) -- console serial 20080220-175343
#
# The BIOS main menu is drawn almost entirely as GS SPRITES: measured at ~66 draws per frame of
# which 64 are sprite-class. Without SPRITE3D the backend refuses all of them at the primclass
# gate, one draw per frame survives, and Remix re-presents the last surface it was handed -- the
# frozen frame the menu appears to freeze on.
#
# SPRITE3D expands each sprite into a quad and submits it as geometry the path tracer lights,
# rather than compositing it as a flat 2D overlay (UIRASTER), which the path tracer never sees.
#
# MODE 2, NOT 1, and this file shipped the wrong one. Mode 1 takes only sprites whose texture
# bound; mode 2 also takes UNTEXTURED sprites, which is how the PS2 paints flat panels and
# gradients -- the menu background is one of them. The screenshots this profile was written from
# were captured at mode 2 (`sprite3d 2` on the overlay line of a 16,706-frame BIOS session), so
# the value that shipped was a step behind the configuration that was actually measured.
PCSX2_REMIX_SPRITE3D = 2


# ---------------------------------------------------------------------------------------------
# OPEN: the menu renders, but as blown-out white on black rather than the BIOS's own dark blue
# gradient and translucent cubes. This is a LIGHTING fault, not an admission fault.
#
# Measured over frames 2,100..16,500 of that session, once the boot logo is past:
#
#     64.3 draws/frame seen, 33.9 submitted -- essentially all of them sprites
#     49 sprite draws/frame considered, 34 submitted, 15 refused `nomat`
#     sky 13,609 FROZEN since frame ~2,100 -- the logo, nothing in the menu is sky
#     DrawLightInstance accepted 1 of 1 lights (sphere no, key yes, dome no)
#
# ONE LIGHT. The whole menu is lit by the injected distant key at radiance 100, 8 degrees, from
# elevation 59.4 / azimuth 223.4 -- an over-the-shoulder angle chosen for world geometry. Every
# BIOS quad is screen-facing, so every one of them takes the SAME N.L from that one off-axis
# source, and there is no fill to lift the rest: PCSX2_REMIX_AMBIENT is 0 and cannot help,
# because a dome light with no colorTexture is a measured no-op through this API (see
# ambient_radiance() in RemixSubmit.cpp). A 2D screen lit this way has one global multiplier
# between fully black and fully saturated, with nothing in between -- which is the picture.
#
# The principled fix is that a 2D screen should be SELF-LIT rather than lit: the untextured
# material already carries emissiveIntensity and emissiveColorConstant, both sitting at 0
# (RemixMaterials.cpp, bind_untextured). That needs code.
#
# These need no code and are the cheap thing to try first. UNARMED -- uncomment one at a time.
#
# A. Make the key omnidirectional so quad orientation stops mattering at all. Irradiance goes as
#    (angle/2)^2, so widening 8 -> 180 degrees multiplies it by ~506 and KEY has to come down by
#    the same factor to hold exposure: 100 -> ~0.2.
# PCSX2_REMIX_KEYANGLE = 180
# PCSX2_REMIX_KEY = 0.2
#
# B. Or leave the key narrow and aim it straight down the view axis, so every screen-facing quad
#    gets N.L = 1 and the image becomes albedo x vertex colour x a constant. Azimuth runs from +Z
#    toward +X and the light travels along -(sin az cos elev, sin elev, cos az cos elev), so these
#    two are the head-on and the backlit case -- try both, one run each, they are obvious by eye.
# PCSX2_REMIX_KEYELEV = 0
# PCSX2_REMIX_KEYAZIM = 0
# PCSX2_REMIX_KEYAZIM = 180


# ---------------------------------------------------------------------------------------------
# OPEN: 15 sprite draws per frame -- 31% of the menu -- are refused with `nomat`, meaning the
# draw was textured but its material did not bind. That is the guest sampling its own render
# target, which is usually a framebuffer blit and not content, so the backend refuses it below
# mode 3. On a screen that IS a composite, some of it may be content.
#
# Mode 3 admits them. It is a DIAGNOSTIC, not a recommendation: it also admits true blits, which
# is how a full-screen untextured quad ends up parked in front of the eye. Run it once and look.
# PCSX2_REMIX_SPRITE3D = 3

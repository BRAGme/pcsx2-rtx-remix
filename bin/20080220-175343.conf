# PS2 BIOS (OSDSYS) -- console serial 20080220-175343
#
# The BIOS main menu is drawn almost entirely as GS SPRITES: measured at ~66 draws per frame of
# which 64 are sprite-class. Without SPRITE3D the backend refuses all of them at the primclass
# gate, one draw per frame survives, and Remix re-presents the last surface it was handed -- the
# frozen frame the menu appears to freeze on.
#
# SPRITE3D expands each sprite into a quad and submits it as geometry the path tracer lights,
# rather than compositing it as a flat 2D overlay (UIRASTER), which the path tracer never sees.
# Mode 2 also admits untextured sprites; measured on this title there are none, but it costs
# nothing and a different BIOS region may differ. Mode 3 admits render-target blits and CRASHES
# the runtime -- do not raise it.
# EXPERIMENT 2026-09-24, and the reasoning is in the OPEN block below: a 2D screen should be
# COMPOSITED, not lit. SPRITE3D = 2 submits the menu as geometry, which is why it is blown out --
# it is being path traced against an injected key light. Mode 0 hands the same sprites to the
# overlay rasteriser instead (sprite_ui_probe needs SPRITE3D == 0 to win them; see the note at
# sprite_geometry in RemixSubmit.cpp), which composites them flat and unlit after tracing --
# exactly what the emulator itself would draw.
#
# IF THE MENU FREEZES AGAIN, PUT THIS BACK TO 2. That is the failure this file was written for:
# with no path taking the sprites, one draw per frame survives and Remix re-presents a stale
# surface. The tell is `raster draws 0` on the overlay stats line -- if the rasteriser is not
# consuming them, mode 0 is strictly worse than mode 2 and the exposure route below is the one
# to try instead.
PCSX2_REMIX_SPRITE3D = 0
PCSX2_REMIX_UIMODE = 1
PCSX2_REMIX_UIRASTER = 1

# RTTEX (render-target snapshots for the refused `nomat` sprites) is DELIBERATELY OFF.
#
# It does clear the counter -- nomat 34,980 -> 0, sprite draws 33 -> 49 per frame -- but the
# picture got worse, not better: the snapshots come back as white noise, they replaced the glyph
# textures that had been rendering correctly, and the boot intro went black. Whatever the BIOS has
# in those targets at snapshot time is not the art. Leave it at 0 until the download path is
# understood; the icons are still missing, and this is not the way to get them.
# RE-ARMED 2026-09-25. The note above stands as a record of what happened, but its cause has
# been found and fixed, so the conclusion no longer holds.
#
# GSTextureCache::Read(Source*) is not format-aware: it always downloads as Format::Color and
# always calls WritePixel32, through an offset built from TEX0.PSM -- which is how the GAME
# SAMPLES the target, not how the target is stored. Sampling a 32-bit target through an indexed
# format is an ordinary PS2 idiom, so the snapshot wrote 32-bit pixels through a 4- or 8-bit
# mapping and decode() read the result as indexed. THAT is the white noise. And because the
# readback writes into GS LOCAL MEMORY, a bad snapshot also corrupted whatever else was
# addressed there -- which is why it "replaced the glyph textures that had been rendering
# correctly". Both halves of the old note, one cause.
#
# The snapshot now refuses any source that is not PSMCT32 or PSMCT24, so the damaging case
# cannot happen. Separately, a 2D screen bound for the rasteriser is now allowed to ask for a
# snapshot at all -- before, allow_render_target_snapshot was sky_draw || sprite_geometry, and
# with SPRITE3D at 0 this title satisfied neither.
#
# THIS IS THE EXPERIMENT FOR THE MISSING ICONS. Measured on this run: screen-ui seen 60,572 with
# nomat 20,618 refused, raster draws 38,314, and skip: target 6,548 against rt snapshots 0 --
# a third of the menu is render-target art with no way to reach a material.
PCSX2_REMIX_RTTEX = 1
#
# READ BACK `rt snapshots N` against `skip: target`. Snapshots climbing while target falls means
# the icons are arriving. Both unchanged means the BIOS samples those targets through an indexed
# format, the new PSM gate is correctly refusing them, and this needs a format-aware readback --
# real work, not a knob.
#
# IF THE GLYPHS BREAK AGAIN, set this back to 0 and say so: that would mean the PSM gate is not
# catching every damaging case and the fix is incomplete, which is worth knowing immediately.

# ---------------------------------------------------------------------------------------------
# OPEN, measured 2026-09-24: the menu renders, but as blown-out white on black rather than the
# BIOS's own dark blue gradient and translucent cubes.
# ---------------------------------------------------------------------------------------------
#
# Admission is NOT the problem -- SPRITE3D = 2 above is doing its job. Measured over frames
# 2,100..16,500 of a 16,706-frame session, once the boot logo is past:
#
#     64.3 draws/frame seen, 33.9 submitted -- essentially all of them sprites
#     49 sprite draws/frame considered, 34 submitted, 15 refused `nomat`
#     sky 13,609 FROZEN since frame ~2,100 -- that count is the boot logo; nothing in the
#       menu is classified sky, so the sky path is not involved in this
#
# The 34-submitted / 15-nomat split agrees with the 33 -> 49 figure in the RTTEX note above,
# which is the same measurement taken from the other side.
#
# WHAT LOOKS LIKE THE CAUSE, and the one thing to check before acting on it. That session logged:
#
#     DrawLightInstance accepted 1 of 1 lights this window (sphere no, key yes, dome no)
#     scene lighting -- distance-independent fill (key 100 at 8 deg, elev 59.4, azim 223.4)
#
# One light, and it is the injected world-geometry key: an over-the-shoulder angle at radiance
# 100. Every BIOS quad is screen-facing, so all of them take the SAME N.L from that one off-axis
# source, and nothing fills the rest -- PCSX2_REMIX_AMBIENT is 0 and cannot help, because a dome
# light with no colorTexture is a measured no-op through this API (see ambient_radiance() in
# RemixSubmit.cpp). That leaves a single global multiplier between fully black and fully
# saturated, with nothing in between, which is what the screen looks like.
#
# THE CAVEAT, stated because it would otherwise waste a session: that measurement was taken with
# a key light live. The PCSX2 settings overlay can carry LIGHTMODE = 0 (no injected lights at
# all) per game, and at least one title's overlay does. If LIGHTMODE is 0 when you run this, the
# reasoning above does not apply and the diagnosis has to be retaken -- so read the
# 'DrawLightInstance accepted' line for the run you are actually looking at before trusting any
# of this. The log that produced it has since rotated and cannot be re-read.
#
# The principled fix is that a 2D screen should be SELF-LIT rather than lit: the untextured
# material already carries emissiveIntensity and emissiveColorConstant, both sitting at 0
# (RemixMaterials.cpp, bind_untextured). That needs code.
#
# Two config-only candidates, UNARMED, neither of them run. Uncomment one at a time.
#
# A. Make the key omnidirectional so quad orientation stops mattering. Irradiance goes as
#    (angle/2)^2, so widening 8 -> 180 degrees multiplies it by ~506 and KEY must come down by
#    the same factor to hold exposure.
# PCSX2_REMIX_KEYANGLE = 180
# PCSX2_REMIX_KEY = 0.2
#
# B. Or keep the key narrow and aim it down the view axis, so every screen-facing quad gets
#    N.L = 1 and the image becomes albedo x vertex colour x a constant. Azimuth runs from +Z
#    toward +X and the light travels along -(sin az cos elev, sin elev, cos az cos elev), so
#    these are the head-on and the backlit case -- try both, one run each, obvious by eye.
# PCSX2_REMIX_KEYELEV = 0
# PCSX2_REMIX_KEYAZIM = 0
# PCSX2_REMIX_KEYAZIM = 180

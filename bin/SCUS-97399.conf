# God of War (SCUS-97399)
#
# Starter profile. NOTHING BELOW HAS BEEN MEASURED ON THIS TITLE, and unlike the SOCOM
# profiles this is not even a same-engine transplant -- God of War is Santa Monica's own
# engine, not Zipper Interactive's. The two knobs below are the engine-INDEPENDENT half of
# the SOCOM findings (a game presenting below the vsync rate), which is the only part with
# any reason to carry across. Everything engine-specific -- MINRT, SKY, SKYMINW -- is
# deliberately absent, because guessing those culls geometry rather than fixing anything.
#
# An earlier copy of this file was headed "SOCOM II" and claimed a measurement taken on
# another title. Both were copy-paste errors and are corrected here.
#
# There is deliberately no gamesettings overlay for this serial. Do NOT open the Remix
# settings page while this title is loaded -- doing so serialises the whole GUI knob state
# into gamesettings\SCUS-97399_<hash>.ini, which reaches the backend through the environment
# BEFORE this file is read, and every line here then logs as "SKIPPED (already set in the
# environment)".

# The below-vsync empty-window fix.
#
# PCSX2_REMIX_BATCH defaults to 0 (RemixSubmit.cpp batch_mode()), and the hold-empty fix
# rides the batch path ONLY -- under BATCH = 0 it counts empty windows and holds nothing.
#
# The mechanism is engine-independent: when the game renders below the vsync rate, every Nth
# presented window submits zero geometry and presents an empty scene, which reads as the
# whole world flickering or shattering for one frame. HOLDEMPTY = 2 re-presents the previous
# window (geometry AND camera) so the held frame is a true duplicate.
#
# CHECK BEFORE BELIEVING IT: read the empty/held/gap3 counters. If "empty windows" is ~0,
# this title does not have the problem and both lines are inert here.
PCSX2_REMIX_BATCH = 1
PCSX2_REMIX_HOLDEMPTY = 2

# Keep dynamic batch meshes alive while Remix finishes its async ray-tracing build.
# Measured on Combined Assault: three frames produced VK_ERROR_DEVICE_LOST on camera turns.
# Coupled to HOLDEMPTY, which re-draws a previous batch and so depends on it still being
# alive -- shipping HOLDEMPTY without this is not a safe transplant.
PCSX2_REMIX_BATCHRETAIN = 16

# SOCOM: U.S. Navy SEALs -- Combined Assault (SCUS-97545)
#
# Read by remix_ps2::materials at frame boundaries and pushed through
# remixapi_SetConfigVariable, which writes Remix's *user* layer and therefore outranks rtx.conf
# and any Logic-graph layer. An existing environment variable always beats this file, so A/B
# harnesses stay authoritative.

# Volumetric fog was rendering the mission unplayable -- not dimming it, hiding it.
#
# MEASURED in-mission, three captures each, identical scene:
#                     lit_px      mean_sat   coloured_px
#   volumetrics on     2,502,313    0.0378      0.00%      <- uniform grey wash, whole frame
#   volumetrics off       26,874    0.2785     34.31%      <- geometry and colour visible
#
# The fog filled every pixel at luminance ~82 and washed out all colour, which is what the user
# was describing as flickering grey with characters only faintly visible. The runtime says why:
#
#   [RTX-Compatibility-Info] Volume Froxel Max Distance set to 2,000 but current camera frustum
#   allows only a maximum of 1,001.03
#
# SOCOM's scene radius is ~5,807 and maxpos ~5,350, against Rainbow Six 3's ~5. The froxel volume
# is sized for R6 3 and is meaningless here -- the same per-title scale problem that makes light
# radius, radiance, far plane and emissive intensity wrong on this title. Disabled per-game rather
# than globally, because R6 3 renders correctly with volumetrics on.
#
# This is a mitigation, not the fix. The fix is deriving the volumetric extent from the frame's
# measured scene bounds, at which point this line should be removed and re-measured.
rtx.volumetrics.enable = False

# SOCOM bakes its lighting into per-vertex colour, so submitting that colour multiplies albedo by
# the game's pre-baked shadows and then path-traces and lights it a second time.
#
# MEASURED over 43,825,580 vertices in-mission: mean luminance 45.7 of 255, neutral(128,128,128)
# 0.0%, 83% of vertices in the two darkest buckets, and 1,200,752 draws with *varying* colour
# against 397,110 constant. PS2 unity is 128, so essentially nothing is at full brightness and
# three quarters of draws carry a gradient across the surface -- baked lighting, not a tint.
#
# Discarding it (alpha is still kept -- that is real transparency) measured, same scene:
#                  lit_px    mean_lum
#   VCOLOR=1        98,475     35.6
#   VCOLOR=0       961,904     59.9     <- 10x the lit coverage
#
# Rainbow Six 3 has not been measured for this and keeps the default, so this stays per-game.
#
# 2026-08-06: this line was NOT IN EFFECT in the deployed install, and had not been for some time.
# The settings page had written a global `[Remix] VCOLOR = true` into inis/PCSX2.ini, and a GUI
# knob reaches the backend through the process environment BEFORE this file is read, so the log
# said `PCSX2_REMIX_VCOLOR = 0 SKIPPED (already set in the environment)` -- silently inverting the
# documented precedence. SOCOM was therefore rendering with baked per-vertex lighting multiplied
# into albedo, i.e. the 98,475-lit_px arm above, which by eye is dark flat surfaces.
# Fixed by deleting the VCOLOR row from both inis/PCSX2.ini files; absent from the ini means
# "leave the backend default alone" and this file then governs. Verified: the same launch now logs
# `PCSX2_REMIX_VCOLOR = 0 (PCSX2 toggle)`.
# CHECK THIS after any visit to the Remix settings page -- it will write the row back.
PCSX2_REMIX_VCOLOR = 0

# Stable mesh identity. This is the flicker: without it essentially every draw mints a brand new
# mesh handle every frame, so Remix's temporal denoiser has no history to accumulate and the mesh
# cache sits pegged at its cap being constantly evicted.
#
# MEASURED in-mission, normalised per frame because the two runs reached different frame counts:
#                              STABLEID=0     STABLEID=1
#   mesh creations / frame          165.9           62.2
#   creations per submitted draw    99.7%          32.9%
#   meshes live                4096 (PEGGED)        2587
#   identity reuse                      --   244,094 reuse vs 145,437 create
#
# Every draw was minting a fresh handle; now two thirds re-instance and the cache has headroom.
# Both arms needed 9 launch attempts to reach a settled mission, so no survival penalty was
# observed in this pairing.
#
# WATCH FOR: rebuild 53,060 and probes 196,645 mean the rigid registration is working hard, and
# Kabsch matching across repeated outdoor props is the known risk -- objects visibly swapping or
# popping between frames. If that shows up, delete this line; the default is off.
#
# 2026-08-06: the user reports exactly that -- geometry popping and the scene teleporting -- so
# this line is still the leading suspect, but the verdict needs an eye, not a counter, and it has
# NOT been given yet. What was measured today, in-mission with STABLEID=1: id rebuild climbs
# continuously (11,136 -> 13,927 over 1,440 frames) and `meshes live` swings 4,096 -> 242 -> 2,036
# inside seconds, so the cache is still evicting hard even with identity on. Play one session with
# PCSX2_REMIX_STABLEID=0 in the environment (`id: mode 0` on the stats line is the positive check
# that it took) and compare. If the popping goes, delete this line.
PCSX2_REMIX_STABLEID = 1

# Keep the Remix submission queue at one mesh group per frame. This avoided the NVIDIA device
# reset seen when the SOCOM menu first began submitting materials.
PCSX2_REMIX_BATCH = 1
PCSX2_REMIX_DRAWDUMP = 0
PCSX2_REMIX_DRAWDUMP_WORLD = 0
# ARM 2026-08-15: put the dump in GAMEPLAY, not mission start. The first dump this title ever
# produced landed on frames 3/5/6/8 -- 11 sky draws each, where in-mission the counter settles
# to 2.0/frame -- so it described a scene nobody asked about. ~1200 submitting frames is ~20 s
# in. Set to 0 or delete once the follower draw is identified.
# Live override for the installed diagnostic build; restores the proven camera seed.
PCSX2_REMIX_PINCAM = 1
PCSX2_REMIX_DUMP = 0

# ARM 2026-08-15: measure the 1-in-3 shattered frame. Writes one FRAME line per presented
# window into logs\remix_matrices.txt for this many windows, then stops. Default 0 (off).
#
# WHAT THIS IS FOR. The user's "triangles flickering, almost like z fighting" is NOT depth
# precision: measured from their 04:39 clip, one presented frame in three renders the whole
# world exploded into spikes and the other two are clean (f30/f32 clean, f31/f34 shattered).
# Exposure-invariant NCC settles it -- clean-to-clean 0.94-0.99, shattered-to-shattered
# 0.12-0.43, so the bad frames do not correlate even with each other. A tonemapper wobble
# would preserve structure and score high; this is different geometry.
#
# RULED OUT, do not re-derive: the camera is accepted on EVERY frame (`accept` 298 -> 598 ->
# 898 over 900 frames, REFUSED 0), so drop_stale_camera() never fires and this is not camera
# dropout. The 2-on/1-off cadence in remix_matrices.txt is NOT a capture failure either --
# that dump writes one line per never-before-seen matrix CONTENT (RemixSubmit.cpp:2014), so an
# absent frame had candidates, just no new ones. What it really measures is that every third
# vsync window sees zero new VU1 uploads of any kind: the game builds frames at 40 fps while
# we present at 60, and the two units disagree every third window.
#
# WHAT IS STILL UNKNOWN, and the only reason this arm exists: which form that disagreement
# takes. Read the FRAME line's fields -- ringN > 0 means one window straddles two game frames;
# a dip in sub means a sparse partial window; miss dominating means the kick ring is not
# recording on this title. Those need three different fixes, so do not fix before reading it.
#
# 600 windows is ~10 s in-mission. Set to 0 or delete the line when the measurement is taken;
# the per-draw sampling behind it walks the kick ring, so leaving it on costs GS thread time.
PCSX2_REMIX_FRAMETRACE = 0
# ARM 2026-08-15: put the trace in GAMEPLAY. The first trace armed at the first submitting
# window and covered ~34-934 -- which the per-window census then proved is almost all startup:
# `multi` freezes at 126 while windows climb 353 -> 1952, so the multi-camera condition the
# trace was hunting STOPS at ~600 and never recurs. The trace characterised loading and was
# read as though it characterised gameplay. Second time this mistake was made in one session;
# DRAWDUMPAFTER exists for exactly the same reason.

# Per-draw camera placement (step 4A). 0 = frame-latched (pre-4A), 1 = each draw is
# un-projected with the camera its own XGKICK carried.
#
# ENABLED 2026-08-15 on the census this build shipped to decide it, MEASURED in-mission:
#   solvers/window last 1 peak 2 (multi 325 of 1574 windows) | rings/window peak 2
#   draws distinct 106445 same-solver 481917 match 5743 fallback 857 | solves 1569 refused 0
#
# peak 2 is the whole verdict: a window really does contain two distinct un-projections, so
# the frame-latched camera is wrong for one of the two groups. 106,445 of 588,362 draws
# (18.1%) are placed with a camera that is not their own. 1,574 windows here include the
# ~1/3 that submit nothing, so 325 multi-camera windows is ~31% of the windows that carry
# geometry -- which lands on the 1-in-3 shattered-frame rate measured from the user's clip.
#
# REFUTED ON THE WAY, do not re-derive: (a) camera refusal (REFUSED 0), (b) camera dropout /
# stale hold (a camera is accepted for every window, fresh=0 on 0 of 600), (c) the kick ring
# failing to record (823 misses total, all in the first traced window), and (d) my own claim
# that the solver normalises the 10x column-scale variant away -- it does NOT: tan(fovY/2)
# across the fovY groups is in ratio 1.000 : 1.010 : 6.001 : 9.999, so the x10 variant is its
# own fovY group. `aspect` cannot detect that -- it is sx/sy, so a uniform scale cancels out
# of it by construction. Read fovY, never aspect, when asking about scale.
#
# WATCH FOR: `refused` climbing, or extent-reject / maxpos moving off 0 -- either means a
# per-draw solve is being accepted that should not be. Set back to 0 and say so.
PCSX2_REMIX_PERDRAWCAM = 0

# Hold-previous-window (step 4B). 1 = a presented window that submits NO geometry re-presents
# the previous window's batch, at most once in a row; 0 = it presents an empty scene (pre-4B).
#
# MEASURED 2026-08-15 in GAMEPLAY (FRAMETRACE 600 with FRAMETRACEAFTER = 1200, 171 windows
# f=2002..2172): sub = 0 on 57 of 171 windows (33.3%), spacing EXACTLY 3 in 56 of 56 gaps.
# sub on every other window is a flat 300-399 -- no dips, no sparse windows. sol = 1 on all
# 114 non-empty windows (so PERDRAWCAM cannot help here; rings = 2 is one camera at two column
# scales). miss 0 total, fresh = 0 on zero windows. The game renders at 40 fps against a 60 Hz
# present, exactly as the status bar says.
#
# INFERRED, NOT PROVEN: that the empty window is the shattered frame in the clip. The trace and
# the clip are different runs and the identity was never established frame-for-frame. It is the
# strongest candidate only because nothing else varies with period 3. If the shattering
# survives this, the mechanism is elsewhere -- re-diagnose, do not tune.
#
# WATCH: `offcadence` on the 'hold-empty' stats line. Every hold should land exactly 3 windows
# after the last one; anything else is the detection firing where it was not designed to.
#
# 2026-08-15, RAISED 1 -> 2. Modes: 0 = off (present an empty scene, the pre-fix shattering),
# 1 = hold geometry only, 2 = hold geometry AND camera, 3 = do not present the empty window.
#
# Mode 1 fixed the flicker (user-confirmed; measured: the period-3 luma signature is gone, all
# three phases at mean 12.9/13.0/13.0 where the broken clip had one blown to 108-183, peak
# saturation 50% -> 9.5%) but left a smear on camera turns. ROOT CAUSE of that smear, measured:
# mode 1's premise -- that `age = 2` meant the empty window already carried the camera its held
# geometry was built with -- is FALSE. Over FRAME lines f=2182..2312 the camera CHANGED on 43 of
# 43 empty windows and matched the previous on 0, giving the sequence A,A,B,C,C,D. So a mode-1
# held frame re-path-traces last game-frame's geometry from a MOVED eye. Mode 2 re-submits the
# previous camera as well, making the held frame a true duplicate -- which is exactly what stock
# PCSX2 does when it re-blits identical pixels on a duplicate vsync.
#
# THE JUDDER FLOOR IS NOT OURS. The game is natively 40 fps (user confirmed it reads 40 with RTX
# off), so 40 frames into 60 presented windows cannot pace evenly and some judder remains in
# modes 0-2. Do not read residual judder as this fix failing.
#
# Mode 3 removes that floor, but only on a VRR display (the user's is an LG G3): the empty window
# is not presented at all, so the present rate becomes the game's native 40 Hz and the panel
# refreshes to match. Audited safe -- PCSX2's throttle is downstream of us and a skipped window
# makes zero Remix API calls -- but NOT runtime-tested, and this title has a GPU-hang history.
# Try mode 2 first; if mode 3 shifts emulation speed or audio pitch, come straight back to 2.
PCSX2_REMIX_HOLDEMPTY = 2
# Keep dynamic batch meshes alive while Remix finishes its asynchronous
# ray-tracing build; three frames was producing VK_ERROR_DEVICE_LOST on turns.
PCSX2_REMIX_BATCHRETAIN = 16
# Diagnostic: keep SOCOM in the view-space fallback while validating geometry.
# This must live in the game config because PCSX2 launches the emulation child
# separately and a parent-process environment override is not retained there.
PCSX2_REMIX_NOCAM = 0
# Auxiliary untextured PS2 passes remain enabled; the calibrated Z path is valid
# for these draws and disabling them removes a large portion of the world.
PCSX2_REMIX_UNTEXZ = 1

# NOT the camera. RULED OUT 2026-08-06 -- do not re-derive.
#
# The other candidate for "the whole scene teleports" was the camera-fallback path: on a frame
# where the world camera fails to resolve, submit_camera() sends an origin camera while the
# geometry path switches to view space, which is a one-frame full-scene jump. It does not happen
# here. `cam fallback` FREEZES the instant the world camera first resolves and never advances
# again, while `cam world` climbs by exactly the stats interval every block:
#
#   run          in-mission frames observed   cam fallback delta   cam world delta
#   base_a3      1,440                        0                    +60 per 60-frame block
#   ctl_a2         420                        0                    +60 per 60-frame block
#   base4          366                        0                    +60 per 60-frame block
#
# 2,226 consecutive in-mission frames, zero fallbacks. Every fallback in a session is pre-mission
# (the deploy menu never solves a camera at all). So PCSX2_REMIX_CAMHOLD was never built: there is
# nothing for it to hold through.

# TRAP, and it cost most of a session on 2026-08-06.
#
# SOCOM was rendering untextured with `replacement dds 0 probe 0`, which reads as "the texture
# route is broken". It was not. PCSX2's PER-GAME SETTINGS OVERLAY --
# `gamesettings/SCUS-97545_D7CFDCCF.ini`, which is a DIFFERENT file from this one -- carried a
# stale `[Remix] MATSTAGE = 1` from an old bisection. MATSTAGE=1 means "hash and decode only, hand
# Remix nothing", so create() returned before CreateTexture and every surface got a null material.
# Clearing that section took the same scene from `replacement dds 0` to `replacement dds 1
# probe 1` with no other change.
#
# Worse, that overlay silently OUTRANKS this file: its keys reach the backend through
# apply_knob() -> the process environment -> apply_before_runtime_load(), which runs before
# refresh_game_config() reads this conf, and this conf then skips them as "already set in the
# environment". So `PCSX2_REMIX_MATSTAGE = 4` written here would NOT have fixed it.
#
# CHECK FIRST, every time textures look wrong: the log line `Remix: first material create --
# MATSTAGE n` says what the backend actually got. Anything below 4 means no textures, by design.

# Reject draws that render into a small OFF-SCREEN target. This is the geometry scatter.
#
# Winterblade (slot 1) draws into two targets: the 640x448 main framebuffer, which takes 1,859 of
# 1,867 dumped draws, and a 128x128 one that takes the other 8. Every one of the 200 draws caught
# by PCSX2_REMIX_FARDUMP=25000 was in that second group -- unanimous across six independent fields
# (rt=128x128, sky=1, fbmsk=0x00ffffff alpha-only, untextured material, ZTST=1, tex psm=0x00).
#
# It is a render-to-texture pass, so un-projecting it with the MAIN camera is meaningless. One such
# draw covers 62x75 pixels on screen and comes out with a world extent of 115,012 units and a w
# range of 0.0156..72,812 within the single draw. Two or three of those per frame.
#
# MEASURED, same save state, ~1,800 frames each:
#                      maxpos     scene r    degen tris    sky    gated
#   MINRT=0 (control)  151,966    11,800     1,657,536     2,867      0
#   MINRT=50            14,613    11,643     1,350,414         0  2,758
#
# maxpos drops 10x and lands inside the scene's own radius instead of ten times outside it.
#
# NOTE sky goes 2,867 -> 0: on this title EVERY sky-classified draw was one of these render-target
# passes, so the classifier was only ever tagging the RTT pass and no real skybox is lost. Do NOT
# carry that reading to Rainbow Six 3, which classifies sky on the main target.
#
# An ABSOLUTE pixel AREA, and the first version of this got it wrong in a way worth recording.
# It compared each target's smaller side against a percentage of the largest side seen so far --
# a reference that only ever grows. One larger target anywhere in the session moves it for good:
# at 50%, a 1024-wide target puts the cutoff at 512, above the main framebuffer's 448 height, so
# the ENTIRE 640x448 world is culled from then on. That is what "geometry disappearing again"
# was. An area has no such ordering dependence: 128x128 = 16,384 is rejected by any threshold
# that keeps 640x448 = 286,720, and an odd framebuffer like 512x224 = 114,688 still clears this.
# Backend default is 0 (off) -- measured only on SOCOM.
PCSX2_REMIX_MINRT = 65536

# Give render-to-texture sources a material. This is the sky.
#
# Winterblade draws the sky as draws 12-13 of the frame: a 620x264 blended quad (ZTST=2 ZMSK=1,
# ABE=1, depth r=1 w=0) sampling a 128x128 texture with target=1 and UVs at [-0.417,3.229] --
# tiled scrolling clouds. RemixMaterials rejected every render-target source ("no stable content
# identity"), which is right for texture REPLACEMENT and wrong as a blanket rule: the sky quad came
# through with mat=0000000000000000, rendered as an untextured null surface, and left Remix with no
# sky and nothing to light the scene from.
#
# MEASURED, same save state:
#                    skip: target    rt snapshots    materials created
#   RTTEX=0             45,831              0               86
#   RTTEX=1                  0              4               91
#
# 45,831 skipped draws to zero for 4 GPU downloads in the whole session -- the entry is keyed on the
# target's IDENTITY (TBP0/TBW/PSM/TW/TH), not its contents, so it is created once and reused.
#
# TRADE, deliberate: the snapshot is taken ONCE, so the clouds do not scroll. Refreshing would mean
# rebuilding the material, and rebuild_material swaps the handle without bumping generation() --
# with PCSX2_REMIX_STABLEID = 1 above, the mesh keeps the dead handle and the surface goes white on
# a timer. A static sky that lights the scene beats an animated one that vanishes.
#
# NOT measured: effect on crash survival. Two of three launches on this arm exited 0x60D0DEAD, but
# three launches is far below the ~20 this project requires to claim anything either way.
# OFF -- SUSPECTED CAUSE OF THE SAVE-STATE FREEZE, and it is my change, so it goes first.
#
# The user reports "every time I load state 1 the game is frozen", reproducible. RTTEX has been on
# for every freeze report; before it the same install CRASHED (0x60D0DEAD) rather than hanging, and
# a crash and a hang are different faults.
#
# Mechanism fits: the snapshot calls GSTextureCache::Read(), which is a SYNCHRONOUS GPU->CPU
# download -- CopyFromTexture, Flush, then Map -- issued from the GS thread inside bind(). A save
# state tears the texture cache down and rebuilds it, so a readback landing in that window can
# block on a target that is being invalidated underneath it. Booting with -state on the command
# line (one renderer bring-up, cache already settled) never froze in ~15 automated launches; the
# freeze is specific to loading into a LIVE session, which is exactly the difference.
#
# NOT yet proven -- this is a correlation plus a plausible mechanism, and the user is blocked, so it
# is switched off rather than studied. If the freeze survives RTTEX = 0, this is exonerated and the
# numos runtime swap is the next suspect (rollback: remix.plus151).
#
# The fix, if confirmed: suppress snapshots for N frames after OnGSStateLoaded rather than dropping
# the feature -- the sky work itself measured clean (skip target 45,831 -> 0 for 4 downloads).
PCSX2_REMIX_RTTEX = 1

# Classify the backdrop as sky. Classification is also what ANCHORS it.
#
# MEASURED 2026-08-15, ravine save, 900 in-mission frames: `sky 0` in all three stats blocks
# (frames 300, 600, 900) -- the classifier tagged nothing, all session -- while the user reports
# the sky dome texture is present and lights up when tagged by hand in the Remix developer menu,
# but rides the view: "the light behind me follows me".
#
# The classifier was not failing; the earlier mode could not match this title. Mode 1 requires a
# draw that neither tests nor writes depth, while this backdrop tests depth. Mode 4 is selected
# here, and with SKYMINW armed it accepts both halves of the far paired backdrop; mode 3 remains
# the render-target-only alternative and is not used by this profile.
#
# Classification IS the anchoring. Both paired halves must be classified sky: being classified sky is
# what selects the bias-zeroed sky solver (:4341-4344, chosen at :4353), i.e. "world rotation,
# zero eye", and what sets REMIXAPI_INSTANCE_CATEGORY_BIT_SKY (:3459). The translation-stripped
# sky camera those are rendered with is ALREADY being submitted every frame on this title: the
# run logs "sky camera submitted -- world orientation, translation stripped" and counts
# skycam 897 against cam world 897 at frame 900.
#
# A BY-HASH TAG CANNOT DO THIS JOB, which is the resolution of "I tagged it and it still follows
# me". rtx.skyBoxTextures / rtx.worldSpaceUiTextures set the Remix instance CATEGORY, but the
# solver is chosen before materials::bind() runs, so no material hash exists yet at the point the
# geometry is un-projected. Geometry has to be classified by geometry. The user's WORLD_UI tag on
# 0xA7B51E14266B7904 (rtx.conf:1) therefore lights the dome and cannot anchor it, and it stays --
# it is theirs, and it is not in conflict with this.
#
# Fresh Highwire capture supersedes the earlier ordinal-only notes above: paired backdrop
# triangles share their screen bounds at w ~= 7,000..11,000, with the textured color half
# writing depth and the companion depth-only half not writing it. Near non-sky draws reach
# min_w ~= 1,584, while the first sky-only population begins near 1,682. SKYMINW below is the
# midpoint, and mode 4 includes both halves only while that measured floor is armed. SKYORDER
# remains 0 so it cannot cut off the far backdrop before the distance test.
PCSX2_REMIX_SKY = 4
PCSX2_REMIX_SKYORDER = 0

# Bind albedo to the user's upscaled .dds pack instead of the API pseudo-path.
#
# The pack is already installed and already loading into PCSX2: 3,515 .dds / 1,074 MB at
# textures/SCUS-97545/replacements, with LoadTextureReplacements = true. It could not reach Remix,
# though, because decode() reads texels out of GS LOCAL MEMORY -- the original 8-bit PS2 data --
# while PCSX2 keeps the replacement in the texture cache's GPU texture. Two different places. So
# D3D11 renders the upscales and the Remix path faithfully uploads the originals.
#
# (2026-08-15: the second line above was SPLIT IN TWO, in both copies of this file -- a literal CR
# eaten out of `\r` at authoring time -- which left `eplacements, with LoadTextureReplacements =
# true. It could not reach Remix,` standing as a bare config row. The parser dutifully applied it:
# `Remix:   eplacements, ... FAILED (GENERAL_FAILURE)` and the "1 failed" in the per-game config
# summary line beneath it. Nothing behavioural -- a key that fails sets nothing -- but it is one
# line of noise in every run's log, so it is rejoined here, with a forward slash so that
# re-authoring this path cannot reproduce it.)
#
# REPLACEALBEDO points albedoTexture at the .dds file path, which is the route that actually
# carries the pack. Previously measured at 154 of 155 materials resolving -- full coverage, nothing
# rejected for format -- but judged "still looks flat" and shelved. That verdict was taken on the
# July runtime with ALPHASTATE = 0, i.e. with blend state suppressed entirely, so it is not
# trustworthy and is being re-run here.
#
# KNOWN SIDE EFFECT, do not re-diagnose it as a fault: with the file branch winning for most
# textures, the API-uploaded ones stop being referenced by any material and the Remix developer
# menu's texture list goes EMPTY. That emptiness is what once sent this project hunting a shading
# bug that was really a supply problem.
# REFUTED 2026-08-09, and this time with a picture rather than a counter.
#
# MEASURED on numos, SOCOM slot 1: replacement dds 53 of 64 live materials resolved -- full
# plumbing, nothing rejected for format -- and the scene rendered almost entirely WHITE. Soldiers,
# rocks and ground all untextured; only a couple of surfaces kept their texture.
#
# So the file-path route does NOT render. All it does is displace the API pseudo-path textures that
# WERE working: 53 materials stop pointing at an uploaded texture and start pointing at a .dds the
# runtime does not resolve. This is the same failure the comment in RemixMaterials.cpp predicted,
# now confirmed visually instead of by counter.
#
# The earlier "154 of 155 resolved" reading was plumbing, not rendering. Do not re-run this arm on
# the strength of that number again -- the counter says the path was CHOSEN, never that it DREW.
PCSX2_REMIX_REPLACEALBEDO = 0

# ARM 2026-08-15: does un-projection recover STABLE world positions as the camera rotates?
# Read-only probe. Follows the 4 largest static draws by CONTENT hash (guest TEX0/CLUT state,
# untouched by any camera -- the mesh hash would be broken by the very defect being measured).
# Reset on save-state load, so AFTER counts from the load. Delete both lines when read.
PCSX2_REMIX_WORLDPROBE = 0

# 2026-08-15: the sun is now placeable. The shipped hard-coded direction {0.35,-0.86,0.37}
# works out to 59.4 deg ABOVE THE HORIZON -- measured over a real 360 turn (1046 samples,
# pitch constant at -9.2 deg) the angle between view and light only moved 50.2..111.5 deg,
# so it can never pass in front of or behind you. It circles overhead and reads as "a light
# that follows the camera". With an 8 deg disc (16x the real sun) nothing casts a defined
# shadow either. Late-afternoon start below; edit live, the conf re-polls once a second.
PCSX2_REMIX_KEYELEV = 30
PCSX2_REMIX_KEYAZIM = 200
PCSX2_REMIX_KEYANGLE = 2
PCSX2_REMIX_KEY = 800

# AUDIT ONLY, no behaviour change. Fits d(world bearing) = alpha * d(camera yaw) over window
# pairs with a provably constant draw set. alpha 0 = world holds still (correct), 1 = world
# rides the camera, 2 = world mirrored about a camera-fixed plane.
PCSX2_REMIX_WORLDFIX = 0

# Camera falsification test. Scores EVERY candidate by how far static geometry drifts in
# recovered world space between two windows while the camera turns. alpha is dimensionless:
# 0 = correct, ~1 = elected matrix carries no view rotation (world orbits the player),
# ~2 = mirrored about a camera-fixed plane. Mode 1 is audit only and cannot change a pixel.
PCSX2_REMIX_CAMTEST = 0

# Score EVERY sliced matrix, not just the ones the split/perspective shape filters admit.
# The election discarded ~334,100 matrices to keep ~15 candidates; if the true view-
# projection is among the rejects, the drift test finds it the moment it can see it.
# Audit-only while CAMTEST = 1 -- nothing this adds can ever be elected.
PCSX2_REMIX_CAMTESTALL = 0

# Heartbeat: CAMTEST now reports every N armed windows whether or not a table fires, so a
# silent run is no longer an unreadable run. Read EYE TURN max and WITNESSES SURVIVING first
# -- together they separate "did not turn" from "the sampler is dropping witnesses".
# First table after this many qualifying pairs, then 2x up to 60. Was a flat 60, which no
# normal play session was reaching.

# The view-projection lives in vf01-vf04, written by a DIFFERENT microprogram (writers at
# 0x1c8-0x258, below this program's start_pc=0x18c8) which composes it and also stores it to
# VU1 qwords 0..3 (SQ vf01..vf04, 0..3(vi00)). An ADDRESS-BASED back-slice of the mission
# program is structurally blind to that -- which is why every "camera" published so far has
# been an object transform. slice-vf reads the registers directly.
# BOTH CHANGE THE PICTURE: they add entries to a 32-slot candidate set, so which existing
# candidates survive a frame can change, even though neither can be elected while DIVCAM = 0.
PCSX2_REMIX_SLICEAUTO = 0
PCSX2_REMIX_SLICEVF = 0
PCSX2_REMIX_DIVCAM = 0
# Re-dump the microprogram with the corrected fields (kind / delta / kick / dir).
PCSX2_REMIX_UCODEDUMP = 0

# Pair against an ANCHOR window held this many windows so the turn ACCUMULATES. Pairing
# against the previous window gave only 0.44 deg at the game's FULL stick speed (360 in 30s
# = 12 deg/s = 0.2 deg/window), far too small a lever arm to rank anything -- frozen matrices
# won the table for free. A 30-window span sweeps 2..6 deg, a ~9x larger alpha denominator.
# Minimum ACCUMULATED turn for a pair to count, in milli-degrees. Was 250 (0.25 deg).

# Publish VU1 qwords 0..3 (byte offset 0) as a pinned candidate. This is the address SOCOM's
# SETUP microprogram stores the composed view-projection to -- SQ vf01..vf04, 0..3(vi00) at
# 0x0260..0x0278, in a program BELOW the mission program's start_pc, which an address-based
# back-slice of the mission program is structurally blind to.
#
# MEASURED: across a full CAMTEST session -- 49 distinct matrices at 46 distinct VU1 addresses
# -- offset 0x0000 was scored ZERO times. Lowest address ever read was 0x0020. The one place
# the ucode says the camera lives has never been looked at.
#
# A hand-seeded pin now outranks the election's (SetPinnedOffset no-ops while this is set);
# without that it was overwritten to 0x0080 within a frame of arming.

# Depth-scale hypotheses. The one candidate that ROTATES WITH THE VIEW (slice-vf pc=0x2040,
# own-turn 19.7 deg vs a 23 deg pair turn) recovers a world at dscale 7.232e-08 -- i.e.
# |col3| = 1.3827e7, which is 0.824 x 2^24, NOT a power of two. Mode 1 adds a ":w" family
# that divides the whole matrix by the measured |col3|; mode 2 adds ":zw", which swaps
# columns 2 and 3 first -- the only genuinely new degree of freedom, and the reading under
# which a column-3 magnitude of 1.4e7 makes sense at all.
PCSX2_REMIX_CAMDEPTH = 0

# The back-slice program cache was 8 entries, keyed (ucode, start_pc), first-come and never
# rotating. SOCOM's mission ucode is entered at 7+ distinct PCs, so entry point 0x2040 --
# the one holding the register-resident vf01..vf04 chains -- was refused a slot for a whole
# session and source 7 published NOTHING. Two runs earlier it won the race and gave 133 rows.
# Which entry points got sliced was decided by a race between the first few kicks. Refusals
# are now reported on the vu stats line as `programs used/limit REFUSED n`.
PCSX2_REMIX_MAXPROGRAMS = 32

# The table prints 32 of ~4,569 ranked rows, sorted by drift ASCENDING -- and a FROZEN row has
# low drift for free, so the print window filled with frozen rows while the best non-frozen
# eligible row sat at rank #238 and #281. slice-vf looked "all frozen" when it was not.
# A per-source best-non-frozen line now prints unconditionally; these two only widen the
# main table and focus it on source 7.

# Sky by DEPTH, not by draw ordinal. Fresh Highwire capture measured near non-sky draws
# through min_w ~= 1584 and the first sky-only population from ~= 1682. Use the midpoint
# so the mode-4 floor excludes near terrain while accepting the paired far backdrop passes.
# When this floor is armed, mode 4 deliberately classifies both the textured depth-write
# color half and its untextured depth-write-off companion.
PCSX2_REMIX_SKYMINW = 1633

# The sky camera carries the WORLD CAMERA ORIENTATION with translation stripped -- the dev
# menu shows SKY Direction identical to MAIN. If Remix derives environment light from
# sky-categorised geometry, that light rotates with the view by construction, which is the
# "back light following the camera" with every other source now eliminated by measurement
# (zero lights created at KEY = 0, fallbackLightMode Never, sky anchored and unlit).
# 0 renders sky instances with the world camera instead. The overlay row SKYCAM = true was
# unparseable by read_env_int, so this knob has never been anything but its default.
PCSX2_REMIX_SKYCAM = 1

# THE LIGHT THAT FOLLOWED THE CAMERA. The gamesettings overlay had LIGHTMODE = 2, written by
# the Remix settings page. Mode 2 calls place_debug_light(s_active_camera.position) -- a SPHERE
# LIGHT AT THE CAMERA -- and place_sun_light(camera_forward), a distant light along the view.
# It also makes place_fill_lights() return early, which is why the log reported `key 0` and why
# KEY/KEYELEV appeared to do nothing: the fill light was never built.
# Pinned here, and removed from the overlay. CHECK THE OVERLAY after any visit to the Remix
# settings page -- it has written LIGHTMODE = 2 and SKY = 1 back more than once.
PCSX2_REMIX_LIGHTMODE = 0
PCSX2_REMIX_WORLDROT = 0

# Combined Assault Highwire validation profile. Backend and fallback lights are disabled so the
# Remix Stage distant light is the only analytical light under test. Object anti-culling retains
# mountains already seen during a camera sweep so they continue to occlude light behind the view.
rtx.fallbackLightMode = 0
rtx.antiCulling.object.enable = True
rtx.antiCulling.object.enableHighPrecisionAntiCulling = True
rtx.antiCulling.object.enableInfinityFarFrustum = False
rtx.antiCulling.object.farPlaneScale = 10

# Keep true HUD draws on the overlay path while allowing far flat sprites such as the moon to
# remain sky/world geometry.
PCSX2_REMIX_UIMODE = 1
PCSX2_REMIX_UIRASTER = 1
PCSX2_REMIX_UIWMAX = 50

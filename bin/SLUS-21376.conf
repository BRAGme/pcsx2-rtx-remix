# Confirm the conf was applied at all -- grep for the '(per-game conf)' suffix:
#     Remix: PCSX2_REMIX_MAXPROGRAMS = 64 (per-game conf)
# An environment variable already set by the launching shell always beats this file and the conf
# silently loses, so do not also export these when testing.
#
# Then, on the LAST stats block of a run that reached a level (scene r in the hundreds):
#
#   programs N/64, N < 64, REFUSED 0, slice matrices > 0
#     The cap was the whole problem. Candidates exist now -- move on to the election counters
#     on the second stats line, which is a kind of problem this project has solved before.
#
#   programs N/64, REFUSED 0, but STILL slice matrices 0
#     Definitive, and it is the expensive answer: every entry point was analysed and none
#     decodes, so the slicer's idiom does not match Black. Go to the remix_ucode_*_pc*.txt dumps
#     UCODEDUMP just wrote. Do not start here -- this branch is unbounded without them.
#
#   programs 64/64 and REFUSED still in the thousands
#     Black has more than 64 distinct (ucode, start_pc) entry points. Raising the cap is a code
#     change. Before that, see SCANKICKS below -- you are currently measuring through a censor.

# ---------------------------------------------------------------------------------------------
# TWO KNOBS THAT CANNOT LIVE IN THIS FILE
# ---------------------------------------------------------------------------------------------
#
# SCANKICKS caps how many XGKICKs per frame the camera scan examines. Default 16. It is latched
# once in SetArmed(), before a per-game conf is read, so it has to go in the PCSX2 settings
# overlay instead -- gamesettings\SLUS-21376_5C891FF1.ini, section [Remix]:
#
#     [Remix]
#     SCANKICKS = 4096
#
# It is not only a tuning knob here, it is a MEASUREMENT PROBLEM: `publish()` runs after the
# budget gate, so `vu kicks` on the stats line is itself censored at SCANKICKS. The 16.00/frame
# those Black logs report is the cap, not Black's rate. At ~1,500 draws/frame the real number is
# certainly far higher -- Rainbow Six 3 issues ~1,230 -- and you cannot currently see it.
# On Rainbow Six 3 this knob alone moved the world-anchored median from 27.5% to 64.9%.
#
# SCANWINDOWS turns on the exhaustive 16 KB shape scan -- the ONLY generic mechanism for finding
# an unknown camera address. It is a namespace-scope `const bool` initialised at static-init time,
# before main, and it is not in the GUI knob table either, so neither this file nor the settings
# overlay can reach it. Only a real process environment variable set before launch can.
#
# That is the hole in the discovery loop: the one knob that finds an unknown camera is the one a
# per-game profile cannot turn on. Un-latching it is about five lines -- read it per kick into a
# local, exactly as SLICEVF and SLICEAUTO already are -- and it would convert most of the rest of
# this problem into configuration. The file's own comment already flags the defect.

# ---------------------------------------------------------------------------------------------
# NOT WORTH TRYING YET
# ---------------------------------------------------------------------------------------------
#
# EECAM reads the camera out of EE main memory and is what Rainbow Six 3 needed, its camera not
# being in VU1 at all. It will NOT serve Black as written: the generic path hardcodes an Unreal
# FRotator -- three int32 16-bit turn angles -- and Black, on a RenderWare-derived engine, will
# hold an RwMatrix of floats instead. That would need an EECAMMAT mode, ~80-150 lines. But it is
# only worth writing once the ADDRESS is known, and finding the address is the actual problem.
# (RenderWare inferred from the engine lineage, not from any disassembly -- treat as a lead.)
# A position lead now exists: EE CAMERA LEAD, in GAME DATA above.
#
# Note all env values here parse BASE 10, so addresses go in decimal, not hex.

# Black (SLUS-21376) -- Criterion, RenderWare-derived engine
#
# UNSOLVED, and this file exists to take the next measurement rather than to configure a working
# title. Read the whole thing before adding knobs: three plausible readings of the symptom were
# tested against the source and all three were wrong.
#
# THE SYMPTOM: no world camera is ever recovered. Every frame falls back, so the whole scene is
# submitted in the view-space tier and nothing is anchored in the world.

# ---------------------------------------------------------------------------------------------
# THREE READINGS THAT LOOK RIGHT ON THE STATS LINE AND ARE NOT
# ---------------------------------------------------------------------------------------------
#
# 1. `REFUSED 0` DOES NOT MEAN NOTHING WAS REFUSED. On the first stats line REFUSED binds to
#    s_stats.cam_failed -- calls where SetupCamera itself returned non-SUCCESS -- and it is
#    incremented only inside setup_camera_checked(). With `world 0` it is structurally incapable
#    of being anything but 0. It says nothing about the election.
#
#    The election's refusals are on the SECOND stats line: cand, split-reject, score-reject,
#    degenerate-reject, scale-reject, extent-reject, accept. That is the line to read.
#
# 2. `maxpos 2 / scene r 1` IS NOT EVIDENCE ABOUT THIS GAME. With no valid camera, flat draws are
#    classified fallback_screen_ui, which forces q = 1 and routes them through the view-space
#    branch. A screen of w=1 quads produces maxpos ~2 and scene r 1 BY CONSTRUCTION. It is a
#    consequence of having no camera, not a clue about why.
#
# 3. THE COUNTERS ARE CUMULATIVE, NOT PER-FRAME. `frame 1800 | seen 11318 submitted 1446` is 1,446
#    draws submitted IN TOTAL across 1,800 frames -- 0.8 per frame -- not 1,446 per frame. s_stats
#    is reset only at Close. Two of the three logged Black sessions never left the menu at all
#    (`vu kicks 0 ... programs 0/0` for their whole duration), so they measured nothing.
#
# CHECK `scene r` FIRST ON ANY BLACK LOG. If it reads 1, the run stayed in the menu and every
# other number in it is void. The one session that did reach a level read `scene r 325`.

# ---------------------------------------------------------------------------------------------
# WHAT THAT ONE IN-LEVEL SESSION ACTUALLY SHOWED
# ---------------------------------------------------------------------------------------------
#
#   maxpos 380/400000 | scene r 325
#   submitted w (max per draw): <0.1 174  <1 34700  <10 5979  <100 131890  >=100 427697
#
# 427,697 draws at max w >= 100, spanning four orders of magnitude. Black emits a genuine
# perspective Q -- there IS a world transform in there to recover. This is not a game that hands
# the GS pre-transformed coordinates, which was the other candidate explanation.
#
#   vu kicks 6736 scanned 6736 reentrant 0 windows 0 shape-ok 0 |
#   programs 8/8 REFUSED 1990 (last pc=0x02d0 ucode=0xfff85e34d458658b) |
#   slice matrices 0 published 0 | cand 0 (now 0) | ... accept 0
#
# It dies before the election, three ways at once:
#   windows 0 / shape-ok 0  the exhaustive shape scan never ran (SCANWINDOWS, see below)
#   programs 8/8 REFUSED 1990  the program table saturated at the DEFAULT OF 8, so 1,990 kicks
#                              hit entry points the slicer never even looked at
#   slice matrices 0  the 8 that were analysed yielded no decodable matrix
#
# Then resolve_world_camera() takes an uncounted early return -- one `return` shared by four
# distinct causes -- on the `frame.count == 0` arm, drop_stale_camera() clears the camera, and
# submit_camera() falls back. `cand 0` is what pins the arm: the candidate count is accumulated
# ABOVE that gate, so a zero there means no candidate was ever produced.

# ---------------------------------------------------------------------------------------------
# THE MEASUREMENT THIS FILE TAKES
# ---------------------------------------------------------------------------------------------
#
# MAXPROGRAMS is the discriminator: it separates 'the slicer never saw Black's matrix code' from
# 'it saw it and cannot decode it'. Those two answers have completely different costs -- the first
# is a config change, the second is new code -- and nothing measured so far distinguishes them.
#
# 64 is the hard cap in RemixVU1Capture.cpp, not a round number. SCUS-97545.conf already runs at
# 32, so the knob is known to work from a per-game conf: it is read on every cache miss, not
# latched.
#
# DISARMED 2026-09-24 as spent, RE-ARMED 2026-09-25. That was a mistake: the measurement it had
# answered was "does the cap explain slice matrices 0", and the answer was no -- but once
# SLICEW0 made the slicer able to READ Black at all, the cap went straight back to being a real
# limit on how much it sees. Measured with it disarmed: `programs 8/8 REFUSED 85886`, i.e. the
# table saturated at the default of 8 and 85,886 entry points were never sliced.
PCSX2_REMIX_MAXPROGRAMS = 64
# UCODEDUMP stays off -- the 38 dumps it took are still on disk and nothing new needs collecting.
# PCSX2_REMIX_UCODEDUMP = 1

# ---------------------------------------------------------------------------------------------
# ONE RUN NEEDED: THE ACTUAL MATRIX VALUES
# ---------------------------------------------------------------------------------------------
#
# The camera analysis below is built from the microcode's proven STRUCTURE, not from Black's
# matrix values -- no run has ever dumped them (remix_matrices.txt on disk is a different title).
# Two numbers decide whether the fix is what the analysis says: m[0][0] gives the screen
# half-extent, m[2][3] gives |col3| and so whether the :w-consistent form is the one needed.
#
# DUMP writes one line per unique scanned matrix to remix_matrices.txt. Read m[0][0] and m[2][3]
# off any row with div=1 and both are settled. Turn it back off afterwards -- it writes a line
# per unique matrix and Black produces tens of thousands.
# DUMP HAS RUN -- TURN IT OFF. remix_matrices.txt from 2026-09-25 holds 3,434 rows and answered
# the question below. Leaving it on writes a line per unique matrix and Black produces tens of
# thousands.
# PCSX2_REMIX_DUMP = 1

# ---------------------------------------------------------------------------------------------
# WHAT THE DUMP SAID, AND WHY THE ELECTED CAMERA IS WORSE THAN NONE
# ---------------------------------------------------------------------------------------------
#
# With MAXPROGRAMS back at 64 the slicer finally sees the game: programs 58/64 (was 8/8
# saturated), slice matrices 107,242, published 71,277, cand 6,899, and for the first time
# accept 48 -- cam world 241 against fallback 7,259.
#
#   world camera resolved -- source slice-vf, hypothesis ndcY/row-major, score 114.50,
#   fovY 145.4 deg, eye (-36.953, 3.871, -55.909), depth scale 1 (ANISOTROPY 5.06x)
#
# THAT CAMERA IS WRONG. A 145-degree vertical field of view is a fisheye, and an anisotropy of
# 5.06 means the recovered basis is stretched five to one. It squeaks past score_perspective only
# because that gate rejects above 150 degrees, and past CAMANISO only because that defaults to 8.
#
# AND THE FALLBACK IS GOOD. A 19-second clip at 120 FPS renders the interior correctly -- brick,
# glass, furniture, shadows, the HUD composited flat -- with instances pinned at 1,524 and
# buffers at 2,966 for the whole clip, i.e. no identity churn at all. 97% of those frames are
# view-space fallback. The 3% that elect this camera are the black void reported when turning.
#
# So reject it. A wrong world camera is worse than none: the fallback renders, this does not.
# 5.06 measured, so 3 refuses it with room to spare, and a real view transform is very close to
# isotropic -- if a future reading needs more than 3:1, that reading is also wrong.
PCSX2_REMIX_CAMANISO = 3

# ---------------------------------------------------------------------------------------------
# MAIN MENU BLACK: the art is composited through render targets
# ---------------------------------------------------------------------------------------------
#
# The overlay pipeline is not the problem -- during the menu it is working. Measured over the
# first 900 frames:
#
#     frame 900 | seen 2496 submitted 0        no geometry at all, correct for a 2D screen
#     screen-ui seen 1460 nomat 317            317 refused for want of a material
#     raster draws 1143 nopixels 0 texels 27,213,997
#     presents 741 | DrawScreenOverlay available
#     mat live 6 | unique content 7 | skip: target 317
#
# 1,143 draws ARE rasterised and 741 overlays ARE presented, off SEVEN unique textures. The 317
# refusals are all `skip: target` -- render-target sources, the same wall as the in-game white
# surfaces. On a PS2 menu that is where the art lives, so what reaches the screen is the handful
# of non-target draws and the result reads as black.
#
# Two gates stood between that art and a material, and only one of them was RTTEX. The backend
# also required allow_render_target_snapshot, which was `sky_draw || sprite_geometry` -- and with
# SKY 0 and SPRITE3D 0 both are false for this title, so the snapshot was refused before RTTEX
# was ever read. That is now widened to include a 2D screen going to the rasteriser, which is the
# case the code comment already described but only wired to the SPRITE3D route.
#
# ARMED AS AN EXPERIMENT. RTTEX takes a ONE-OFF GPU->CPU download per distinct render target, so
# it is not free and anything animated freezes at its first frame. It was also previously unsafe
# on this game -- it wrote noise over working textures -- and is only worth trying now because
# the snapshot refuses formats it cannot write back.
PCSX2_REMIX_RTTEX = 1
#
# READ BACK `rt snapshots N` on the material line, against `skip: target`. Snapshots climbing
# while target falls means the menu art is arriving. Both staying put means Black samples those
# targets through an indexed format, the new PSM gate is refusing them, and the menu needs a
# format-aware readback rather than this -- which is a real piece of work, not a knob.
#
# BACK IT OUT IF: the in-game picture gets worse, or frame time rises on level entry. The
# download is per distinct target and Black has many.
#
# THIS IS A STOP, NOT A SOLUTION. It buys back the good picture while the right reading is found.
# Expect cam world to go to 0 and everything that depends on a world camera -- sky, injected
# lights, the mesh-identity win that would end the submission cost -- to stay unavailable.
#
# AND THE MODELLED FIX BELOW IS NOT SUPPORTED BY THIS DUMP. The analysis predicted a pixel-scale
# matrix needing a centred-pixel hypothesis with scale = half-extent. The real matrices are
# nothing like that -- they are already near-normalised, with entries around 0.01..0.99 and
# COLUMN 2 EQUAL TO COLUMN 3 to five figures:
#
#   M=[-0.10387   0.011957  0.91884  0.91883
#      -0.011461 -0.31142   0.023156 0.023155
#       0.24296  -0.0095854 0.39385  0.39385
#       9.79      1.1113    55.824   55.883]
#
# Clip z EQUALS clip w. That is a w-buffer projection, not a pixel-space one, and it is why ndcY
# scores at all and why the recovered fov is nonsense. Do NOT implement the centred-pixel slot on
# the strength of the model; the measurement contradicts it.
#
# Also measured, against the same analysis: auto/autoY ARE emitted on some matrices (they appear
# in the res= list), so the claim that ox is always exactly 0 is wrong for the general case.
#
# The 181 rows that score all come from ONE program, pc=0x0d00 ucode=0x577c4eeb367c3207, out of
# 3,434 rows. The bulk -- 1,350 from 9ecb2e12 pc=0x0458 and 1,103 from 48a7ce3b pc=0x0540 -- score
# nothing at all. Whatever pc=0x0d00 is, it is a minority program, and the next question is
# whether it is the view transform at all or something else that merely splits.

# ---------------------------------------------------------------------------------------------
# THE CAMERA MEASUREMENT, AND WHAT IT ACTUALLY MEANT
# ---------------------------------------------------------------------------------------------
#
# Over a 444-second, 18,600-frame session that reached gameplay:
#
#   vu kicks 193110 scanned 193110 reentrant 0 windows 0 shape-ok 0 | programs 38/64 |
#   slice matrices 0 published 0 | cand 0 (now 0) | split-reject 0 score-reject 0
#   degenerate-reject 0 scale-reject 0 extent-reject 0 accept 0 (sliced 0) | camera view-space
#
#   programs 38/64 -- NOT saturated. The default of 8 was saturating at REFUSED 1990; at 64 the
#     table has headroom and REFUSED is gone entirely. So the cap was real, and raising it was
#     necessary to learn anything -- but it was not sufficient, and it was not the answer.
#
#   slice matrices 0 -- every entry point was analysed and none produced a matrix. This file
#     used to read that as "Black's idiom does not match the slicer's". WRONG: the idiom matches
#     exactly. The ORDER does not.
#
# Black's vertex programs transform TRANSLATION-FIRST. From remix_ucode_fff85e34d458658b.bin,
# the entry point named on the original REFUSED line:
#
#     0x02e8  MULAw  ACC  <- vf10 * vf00.w      w row first: it does not wait on the vertex load
#     0x02f8  MADDAx ACC  <- vf07 * vf03.x
#     0x0300  MADDAy ACC  <- vf08 * vf03.y
#     0x0308  MADDz  vf03 <- vf09 * vf03.z      closes -- rows vf07 / vf08 / vf09 / vf10
#
# A textbook matrix-vector product. The slicer opened the chain on the MULAw, recorded vf00 as the
# vertex, then rejected x, y and z on its `ft == vertex_vf || ft == 0` test because their operand
# is vf03. Measured by compiling the slicer standalone and running it on the dumps -- it
# reproduces the backend's own dump header on all 39 Black entry points exactly -- the dominant
# death on every Black program is a chain that saw ONLY its w row, with vertex vf00: 47 of them
# in one program alone.
#
# It is the same bug the Zen note in RemixVU1Capture.cpp documents for Mercenaries, which was
# worked around there with a hard-coded address read (ZENCAM) rather than fixed.
#
# PCSX2_REMIX_SLICEW0 binds the vertex to the first real operand instead. Across all 81 dumped
# entry points on disk, every title:
#
#     complete 218 -> 451    matrices 196 -> 339    regressions 0
#     Black alone: 0 -> 113 matrices, all register-resident, 57 of them feeding the perspective
#     divide -- which is what a projection is, by this codebase's own definition.
#
# Register-resident: a setup program loaded the matrix into the VF file and the vertex programs
# use it from there. The capture side reads such rows live from vuRegs[1].VF at the kick -- but
# only under SLICEVF, only for a chain that feeds a divide or a clip, and it is only ELECTABLE once
# DIVCAM admits the slice-vf source. All three are needed together.
PCSX2_REMIX_SLICEW0 = 1
PCSX2_REMIX_SLICEVF = 1
#
# DIVCAM 2, not 1: it pushes every candidate that does NOT feed a divide below every one that
# does. Its failure mode is electing nothing when no divide-feeder is visible, which is the state
# this title is already in, so it cannot make anything worse. Mode 1 can elect a non-divide
# candidate -- a wrong camera, which is worse than none. Drop to 1 only if 2 elects nothing while
# slice-vf rows are visibly being published.
PCSX2_REMIX_DIVCAM = 2

# ---------------------------------------------------------------------------------------------
# RESULT OF THE SLICEW0 RUN (2026-09-24, 12,600 frames, scene r 55 -- in a level)
# ---------------------------------------------------------------------------------------------
#
#   slice matrices 15152 published 64 | cand 4 | split-reject 38 | accept 0
#   split refusals by stage -- notpersp 38          (and NOTHING else)
#
# The slicer fix worked: 0 -> 15,152 matrices. The blocker moved twice and is now one stage from
# the end. Every refusal is `notpersp`: the matrix inverts, a camera position and a basis come
# out of it, and then P = viewToWorld * fused is not perspective-SHAPED.
#
# WHAT THE MATRIX ACTUALLY IS, decoded from remix_ucode_5131078f3ff67c41.bin:
#
#     0x0528  LQ vf28 <- 1014(vi00)      the camera matrix, four consecutive qwords
#     0x0530  LQ vf29 <- 1015(vi00)      into four consecutive registers, absolute (vi00)
#     0x0538  LQ vf30 <- 1016(vi00)
#     0x0540  LQ vf31 <- 1017(vi00)
#     0x0568..0x0600   SUB/MUL by vf05, vf07, vf08, vf10, vf11   <-- SCALED IN PLACE
#     0x07b8  MULAw ACC <- vf31 * vf00.w    then MADDAx/y vf28/vf29, MADDz vf30 -> vf03
#     0x07f0  DIV Q = vf00.w / vf03.w       so vf03 is clip space and this matrix is the MVP
#
# So qwords 1014..1017 WAS the right address -- the earlier PINOFFSET = 16224 was reading the
# right place. It failed because the stored form is not the form used: the microprogram scales
# the matrix in registers before the transform, and the raw read was `singular` for that reason.
# The register read now gets the final matrix, which is why the refusal moved from `singular` to
# `notpersp`. Do not re-arm PINOFFSET; a memory read cannot see the scaling.
#
# WHY notpersp, AND THE NEXT EXPERIMENT. classify_perspective wants a NORMALISED perspective:
# |m[2][3]| or |m[3][2]| within 0.02 of 1. A PS2 microprogram that bakes the GS screen scale
# into its matrix produces a projectively identical matrix with those terms far from 1 -- same
# NDC, wrong magnitude, refused on shape alone.
#
# CAMDEPTH = 1 adds, for each of the seven existing screen hypotheses, the same hypothesis with
# all sixteen terms divided by |column 3 xyz| (the ':w' family). That division is projectively
# invariant -- it cannot change the NDC -- and it is exactly the normalisation the classifier is
# asking for. The backend's own note says a ':w' reading lands the depth scale at ~1.
PCSX2_REMIX_CAMDEPTH = 1

# ---------------------------------------------------------------------------------------------
# WHY NO HYPOTHESIS CAN ACCEPT BLACK, AND WHAT WOULD (analysis 2026-09-25)
# ---------------------------------------------------------------------------------------------
#
# CORRECTION to the notpersp reading above. A later run shows the refusals are not one stage:
#
#   split refusals by stage -- singular 42856 | unproject 8 | forward 27689 | uphint 458 |
#                              basis 1762 | notpersp 13724        (sums to split-reject 86497)
#   score-reject 673        <-- some candidates DO pass classify_perspective and die later
#
# THE FIRST TEST IS THE ONE THAT FAILS, not the perspective-term one. classify_perspective
# rejects at its opening line, |m[0][1]| > 0.02, for every hypothesis the config enumerates.
# Three different reasons:
#
#   gs, px    FAIL STRUCTURALLY. Both subtract offset*col3 from columns 0 and 1 to undo a
#             screen offset. Black has none to undo, so the subtraction INJECTS a shear: the
#             assumed principal point lands at the screen edge, the recovered forward tilts by
#             ~45 degrees, and the projection comes back rotated.
#   ndc, ndcY RIGHT SHAPE, WRONG SCALE. Every structural test passes. The off-diagonals are a
#             3e-4 rad basis error multiplied by m[1][1] = 388, and the tolerance is ABSOLUTE
#             0.02, so it only means anything for a matrix whose diagonal is near 1. Where
#             conditioning is good enough to pass, it dies at score_perspective instead, on fovY
#             0.2-0.3 degrees and on a square aspect. THAT IS THE 0.2-DEGREE CAMERA that used to
#             win through the CAMYDOWN hole.
#   auto,r6   NEVER EMITTED. Their gate needs |ox| > 1e-6, and for Black ox is exactly 0.
#
# WHY: Black's VU prologue already does the centring these hypotheses exist to discover. It
# loads the rows with a dest mask of .xyw (the z lane is never written -- which is also why a raw
# PINOFFSET read was `singular`: column 2 is whatever the EE left there), subtracts 0.5*col3 from
# columns 0 and 1, scales by qword 1018, and adds the ~2048 GS screen centre as a CONSTANT AFTER
# the perspective divide rather than folding offset*w into the matrix. So the matrix emits pixels
# measured FROM THE SCREEN CENTRE: offset 0, scale = half-extent.
#
# CAMDEPTH 2 and 3 are structurally dead here, so do not spend a run on them: Black's clip-z
# column is the constant (0,0,0,kz), so swapping columns 2 and 3 leaves a w column with no xyz
# part and every candidate refuses at campos. CAMYFLIP cannot help either -- it changes the basis,
# not the matrix, so it fails on the same line as its parent.
#
# THE MISSING HYPOTHESIS is a centred-pixel reading: scale_x = (W/2)/divisor, offset_x = 0,
# scale_y = -(H/2)/divisor, offset_y = 0. Modelled against the real splitter it recovers
# fovY 60.0000 and aspect 1.4286 exactly, scores 5.00 before the CAMYDOWN bonus, and passes
# CAMSCALE. It has to be a NEW slot appended last, never a change to px -- px's offsets are right
# for a title that genuinely emits top-left-origin pixels.
#
# NOT YET IMPLEMENTED, because the above is modelled from the microcode's structure and not from
# Black's numbers. PCSX2_REMIX_DUMP is armed above to settle that first.

# ---------------------------------------------------------------------------------------------
# THE UI IS CLASSIFIED BUT NEVER COMPOSITED
# ---------------------------------------------------------------------------------------------
#
# The stats line reads `screen-ui seen 20304 nomat 0 nondc 0 | raster draws 0`. Nothing is
# failing: 20,304 draws ARE recognised as screen UI, and then nothing consumes them, because
# UIRASTER is 0. They fall through to the geometry path and get path traced as world surfaces --
# which is what 'the UI is not acting like UI' looks like.
#
# UIRASTER = 1 rasterises them into the CPU overlay and composites it through DrawScreenOverlay
# AFTER tracing, so they are flat, unlit and un-denoised, which is what a HUD should be.
PCSX2_REMIX_UIRASTER = 1
#
# UIMODE = 1 keeps that true once a camera exists. At 0 a draw is only screen UI when NO camera
# is valid -- fine today, because Black has no camera, but the moment the camera work above
# lands the HUD would silently revert to world geometry. Arming both now means the UI does not
# regress at the exact moment something else starts working.
PCSX2_REMIX_UIMODE = 1
#
# It shares one overlay buffer with the movie path (MOVIE = 1 above). merged_frame_present()
# claims the whole buffer while a movie plays and releases it on the end edge, so during an FMV
# the movie wins and the HUD is absent. Correct, but if the HUD vanishes in a cutscene, that is
# why, and it is not a UI bug.

# ---------------------------------------------------------------------------------------------
# TERRAIN VANISHING, SKY BLEEDING THROUGH -- THE SKY CLASSIFIER IS EATING REAL GEOMETRY
# ---------------------------------------------------------------------------------------------
#
# THIS ONE CANNOT BE FIXED FROM THIS FILE. SKY and SKYORDER are set in the PCSX2 settings
# overlay, gamesettings\SLUS-21376_5C891FF1.ini, and the overlay reaches the environment before
# this file is read -- the effective-knob line reports `SKY=2 [PCSX2 GUI]`, so a SKY line here is
# skipped as already-set. Change it there, or live from the Remix settings page.
#
# The overlay currently has:
#     SKY = 2        'First N draws', needs Sky draw order
#     SKYORDER = 1
#
# SKY = 2 tags the first SKYORDER draws of every frame as sky unconditionally -- it is an ORDER
# rule, not a test of the draw. Measured: sky 7823 over roughly 7,800 frames, i.e. exactly one
# draw per frame, every frame. A tagged draw is pushed onto a sphere at infinity, so whatever
# Black happens to draw first each frame is removed from the world and the background shows
# through the hole it leaves.
#
# AND BLACK HAS NO SKY GEOMETRY TO FIND. The ELF work above established that the sky is never a
# world draw at all: `clouds` and `gradient` are composited into a 64x32 off-screen target with
# depth test ALWAYS and no Z write, through the same 2D emitter as the HUD. There is nothing in
# the draw stream for a sky classifier to catch, so every draw it tags is a FALSE POSITIVE by
# construction, and each one costs a real piece of world.
#
# SET SKY = 0 IN THE OVERLAY. Not a tuning preference: on this title the feature has no true
# positives available to it. SKYORDER then does nothing and can stay.
#
# The same note explains why tagging the sky texture by hand did not help, and the SKY knob's own
# documentation says so outright: a by-hash tag sets the instance category, but the un-projection
# picks its solver before any material hash exists, so a hand-tagged sky still rides the camera.
#
# IT CAN CHANGE THE PICTURE, and not subtly: a ':w' winner rescales the recovered world about
# the eye by the same factor, which moves scene radius, light placement and the depth-scale
# gate. On a title with no camera at all that is the point. If it elects nothing, try 2 (the
# z/w-swapped family), which recovers a genuinely different world rather than a re-gauged one.
#
# READ BACK: `split-reject` should fall and `accept` rise. If `notpersp` simply stays at 38, the
# shape is wrong for a reason normalisation cannot fix and the next thing to look at is the
# per-component scaling at 0x0568..0x0600 -- vf05/vf07/vf08/vf10/vf11 -- which may be anisotropic
# rather than a uniform gauge.
#
# ALSO NOTE: cand 4 from 15,152 sliced matrices. Publication needs feeds_div or feeds_clip and
# gets 64; the election then dedupes to 4. That is not the current blocker, but if the split
# starts succeeding and the elected camera is wrong, this is where to look next.
#
# KNOWN LIMIT: two programs (48a7ce3b..., 89472f9c...) complete 30 chains each and the slicer keeps
# 16 (RemixVU1Slice::max_matrices). If the camera turns out to be in the overflow, that constant
# is the next thing to look at.
#
# READ IT BACK, in this order, and only on a run whose `scene r` is in the hundreds:
#   1. `slice matrices N` on the vu stats line -- should now be non-zero.
#   2. `cand` / `accept` on the same line, then `cam world` on the frame line.
#   3. THEN LOOK. An elected camera can still be the wrong matrix. Geometry that holds still as
#      the eye turns is right; geometry that swims with the view is not.
#   4. If cam world goes non-zero, `skycam` should follow on its own -- the sky camera is the world
#      camera with its translation stripped (see the sky section below).
#
# RETRACTED, so nobody builds on it: an earlier version of this file claimed the rows were
# "computed two matrix multiplies deep", with "zero loads into vf20..vf27", and armed PINOFFSET =
# 16224 on the strength of it. That came from an analysis script which decoded the LQ destination
# as a 4-bit field -- VF destinations are 5-bit -- so it could not see a load into vf16..vf31 at
# all, and which also mis-decoded LQI/LQD. The PINOFFSET run produced 3,638 candidates and elected
# none (split refusals dominated by `singular`); it is disarmed. The ALU def-use walk that the
# analysis motivated was built on the same error -- the blocker was the vertex binding above.

# ---------------------------------------------------------------------------------------------
# A SECOND, INDEPENDENT MEASUREMENT IN THE SAME RUN
# ---------------------------------------------------------------------------------------------
#
# Black's intro movie is the reproduction case for the .PSS defect: the movie plays, and Remix is
# handed an essentially empty scene. Measured on a 2,700-frame session -- 1 instance, 0 lights,
# 1,812 draws submitted in total, black screen.
#
# MOVIE presents the emulator's own merged output over the traced image while the IPU reports an
# active movie, composited AFTER path tracing. It reads the merged frame rather than the draw
# stream, so it catches both the sprite-blit style and the upload-straight-to-DISPFB style.
#
# It touches nothing the camera work above measures -- different subsystem, different counters --
# so one run answers both questions.
#
# READ IT BACK on the overlay stats line:
#     movie 1 active 1 decodes N presented M refused 0
# presented climbing while a movie plays is the fix working. refused climbing instead means the
# readback is failing -- the display size or the merged texture, not the gate. active 0 with the
# movie visibly playing means the IPU hook never fired and the fault is upstream of all of this.
#
# EXPECT IT TO LOOK LIKE ORDINARY EMULATOR OUTPUT. That is correct and not a bug: pre-rendered
# video must not be path traced, or it would be denoised and temporally accumulated, which smears
# motion. This is compositing, not tracing.
#
# CONFIRMED WORKING 2026-09-24: `movie 1 active 0 decodes 3551856 presented 2938 refused 0`.
# 2,938 frames presented, nothing refused.
PCSX2_REMIX_MOVIE = 1

# ---------------------------------------------------------------------------------------------
# THE FADE TO BLACK -- why it vanished, and the one number that brings it back
# ---------------------------------------------------------------------------------------------
#
# Black does not fade with a black quad. It re-draws the finished 32-bit scene buffer into the
# 16-bit display buffer every frame, and the fade rides in as the VERTEX COLOUR of that resolve
# blit under TFX=MODULATE: RGB = FADE * (0.5*C + 128*gamma), built at VA 0x001C49E0 and issued
# as the last render call of the frame. World, HUD and 2D UI all fade together in one pass.
#
# So there is NO DRAW TO CLASSIFY. A backend that replaces rasterisation drops the fade silently
# and completely, and nothing in the draw stream can recover it. The value has to be read from
# the guest, which is what GUESTFADE does.
#
# Chain: *(float*)(*(u32*)0x0040F4C0 + 0xD560), in DECIMAL because every env value here parses
# base 10. Clamped to [0,1] by the game at VA 0x001AEBD0 and read on the resolve blit at
# 0x001C4DA4. 1 is fully bright, 0 is black.
PCSX2_REMIX_GUESTFADE = 4256960,54624

# ---------------------------------------------------------------------------------------------
# THE BLUR AND THE TINT -- THE OTHER TWO EFFECTS THE BACKEND ERASES
# ---------------------------------------------------------------------------------------------
#
# Same failure as the fade directly above, twice more. Both are framebuffer-feedback sprite
# passes: the reload/respawn blur re-samples the colour buffer as a texture, and the damage tint
# re-draws the colour buffer over itself modulated by a colour. A path-traced backend has no
# colour buffer to feed back, so both vanish with nothing in the draw stream to catch.
#
# GUESTPOSTFX = <blurBase>,<blurOff>,<stateOff>,<tintBase>,<tintOff>, all DECIMAL:
#     4256984 = 0x0040F4D8   gWorld
#      539824 = 0x83CB0      blur mix, float 0..1 (x128 -> the GS ALPHA.FIX byte)
#      539860 = 0x83CD4      effect state, int 0..9; states 0 and 4 skip the blur draw
#     4256960 = 0x0040F4C0   gRenderCtx (the same base the fade above uses)
#       53904 = 0xD290       drawn tint vec4: rgb 0..1 then the blend factor at +0xD29C
PCSX2_REMIX_GUESTPOSTFX = 4256984,539824,539860,4256960,53904
#
# THE TINT IS EXACT. The guest does screen = lerp(screen, screen * c, w), a per-channel multiply
# by 1 + (c - 1) * w, and rtx.tonemap.colorBalance is literally inputColor * colorBalance. The
# gain reproduces all seven measured states to within 0.01, both endpoints exactly.
#
# It is NOT a desaturation, and rtx.tonemap.saturation is deliberately left alone. Black has no
# cross-channel colour mix anywhere in it. The low-health 'greyscale' is state 9, gain
# (0.8, 0, 0) -- green and blue multiplied by zero. It reads as the colour draining out, but it
# is channel annihilation, and running it through a BT.709 desaturation gives the wrong image.
#
# THE BLUR IS EXACT IN SHAPE, APPROXIMATE IN RAMP. Black's blur is uniform, fixed-radius and
# depth-independent; a lens is depth-dependent by definition. The backend gets the uniformity
# from the CLAMP rather than the lens: widest aperture at 5 cm focus drives the circle of
# confusion 10x to 60x past maxBlurRadius for everything beyond ~6 cm, sky included, so every
# pixel takes the clamped value and depth drops out. Radius 25.27 px at 1080p = 2.34% of frame
# height, the disc whose marginal sigma matches the 1.17% measured off the guest kernel.
#
# What stays approximate is the middle of the ramp: the guest cross-fades a sharp and a blurred
# image, so a partial effect keeps a sharp core under a soft halo, while scaling the radius gives
# a uniformly softer image. Endpoints match, the middle does not.
#
# WHILE THIS IS ARMED THE BACKEND OWNS rtx.dof.* AND rtx.tonemap.colorGradingEnabled/colorBalance
# -- it rewrites them whenever the guest's values move, so hand edits in the Remix menu survive
# only until the next change. rtx.tonemap.contrast and .saturation are left to the user.
#
# READ BACK `GUESTPOSTFX state N blur ... -> gain ...` in the log. One line on the first resolve
# and one per state change. Silence after arming means the chain is wrong for this executable;
# a state that moves on damage and respawn means it is live.
#
# The backend folds it into the overlay as a = 1-(1-a)*f, c = c*a*f/a, which is EXACT rather
# than an approximation -- a fade to black and a multiply toward black are the same operation,
# which is the only reason it fits in an alpha composite at all. It is applied AFTER the UI is
# in the buffer, because the guest fades its finished image, HUD included.
#
# EXPECT: a 1.000 s linear fade in, 0.500 s out, and 3.000 s at mission end. All linear, no
# easing. Mission start is THREE fades, not one -- in onto the briefing, out when streaming
# finishes, in again on the live level.
#
# It fails BRIGHT by design: a bad pointer, a null object or a non-finite value all return 1, so
# a wrong address can never black the screen out. If the fade does nothing, the chain is wrong;
# it will not hurt anything while you find out.

# ---------------------------------------------------------------------------------------------
# OPEN: gameplay runs in slow motion. This is EMULATION speed, not frame rate -- the renderer
# reports 68-79 FPS at 12-14 ms while the game itself crawls, which is the GS thread holding up
# MTGS and the EE waiting on it.
# ---------------------------------------------------------------------------------------------
#
# Black is a far heavier submitter than anything else this backend has been tuned against.
# Measured on the same session:
#
#   seen 13,004,834   submitted 11,736,997 over 18,600 frames  =  631 SUBMITTED DRAWS PER FRAME
#   material binds 11,891,765, of which 20,091 ms -- twenty seconds of the session -- was hashing
#   meshes live 4096, i.e. PINNED AT THE CACHE CAP, with +1,348,523 / -1,344,427 lifetime
#     creates/destroys: about 72 created and 72 destroyed EVERY FRAME
#
# A mesh create is a BLAS build, and `meshes live 4096` is EXACTLY the MESHCAP default -- the
# cache is not merely full, it is pinned at the cap and evicting something every time it wants
# something new. 72 evictions and 72 BLAS builds per frame is the shape of a cache that is too
# small for the content, not of a game creating genuinely new geometry.
#
# WHY THIS SHOWS UP AS SLOW EMULATION RATHER THAN LOW FPS: mesh creation runs on the GS thread.
# When the GS thread is busy, MTGS backs up, and the EE waits on MTGS. The renderer keeps
# presenting at 68-79 FPS -- which is why the frame counter looks healthy -- while the guest
# machine behind it runs slow. That is exactly the symptom reported.
#
# ARMED AS A CANDIDATE, NOT AS A FIX. 4x the default, well under the 65536 maximum. It trades
# VRAM and a larger TLAS for fewer BLAS builds, so it is not free and it is not obviously right --
# it is the one-run experiment.
#
# READ IT BACK on the frame stats line:
#   meshes live <N> (+created -destroyed)
# If live settles BELOW 16384 and the create/destroy rate collapses, the cache was the problem.
# If it pins at 16384 too and the rate is unchanged, Black really is producing that much distinct
# geometry, raising it further is the wrong lever, and the next things to look at are STABLEID
# (matches meshes by rigid registration instead of hashing positions, so a mesh that moved is not
# a new mesh) and MESHIDLE.
#
# MESHCAP LATCHES on first call -- `static const` in mesh_live_cap() -- so it can only be set from
# this file or the environment, never from the settings page mid-session.
PCSX2_REMIX_MESHCAP = 16384

# ---------------------------------------------------------------------------------------------
# MESHCAP WAS NOT THE ANSWER, AND THE SLOWDOWN IS THE MISSING CAMERA
# ---------------------------------------------------------------------------------------------
#
# Re-measured at 16384 over 8,100 frames:
#
#     meshes live 16384 (+567248 -550864)      still EXACTLY at the cap
#     mesh/frame peak +2838 -2695              ~70 created and ~68 destroyed every frame
#     distinct handles/frame avg 782 peak 2838
#
# Four times the cache filled just as completely and the churn rate did not move. This file said
# that outcome would mean 'Black really is producing that much distinct geometry'. It is, but not
# for the reason that implied -- the geometry is not distinct, its IDENTITY is.
#
# WITHOUT A WORLD CAMERA EVERY STATIC OBJECT IS NEW EVERY FRAME. Geometry is submitted in the
# view-space tier, so a wall that never moves has different vertex positions each time the player
# does. Mesh identity is a hash of those positions, so the hash changes, the mesh is created
# again, and a fresh BLAS is built for it. The DXVK HUD shows the second-order cost: 5,358
# buffers against 2,679 instances, almost exactly two per instance (vertex + index), against 86
# buffers for 43 instances looking the other way. The cost tracks instance count exactly, which
# is why it disappears looking up at empty sky and returns looking across the map.
#
# So most of this should evaporate when the camera solves. STABLEID is the lever that helps
# NOW: it matches this frame's meshes against the last by rigid registration instead of by
# hashing positions, and a static object under a moving camera is exactly a rigid transform --
# the case it was written for.
PCSX2_REMIX_STABLEID = 1

# ---------------------------------------------------------------------------------------------
# STABLEID WORKS AND IS NOT ENOUGH -- THE COST IS SUBMISSION VOLUME, NOT CHURN
# ---------------------------------------------------------------------------------------------
#
# Re-measured over 12,000 frames with it on:
#
#     id: mode 1 reuse 7,680,176 create 900,998 rebuild 91,211
#     meshes live 12809 (+900998 -880270)      off the 16384 cap, no longer saturated
#     seen 9,548,261 submitted 8,672,385       723 SUBMITTED DRAWS PER FRAME
#     distinct handles/frame avg 2004 peak 3638
#     mesh/frame peak +3245 -6840
#     material binds 8,857,062, of which 13,711 ms -- fourteen seconds -- was hashing
#
# 7.68 million reuses: rigid registration is matching, and the cache came off its cap. So the
# identity problem is largely solved and the game is still slow, which moves the diagnosis: the
# cost is not churn, it is VOLUME. 723 draws and 2,004 distinct meshes per frame is simply a lot
# to hand a path tracer, and that is before the ~75 new meshes each frame costs in BLAS builds.
#
# The one frame in the measurement that created 3,245 meshes is the stutter: every one is a BLAS
# build, in one frame, on the GS thread, with MTGS and the EE waiting behind it.
#
# MESHBUDGET caps new meshes per frame and spreads the rest over following frames. 256 leaves
# the ~75/frame steady state untouched and clips the spike by more than twelve times. The trade
# is real and visible: geometry that misses the budget is absent for a frame or two, so expect
# things to pop in after a hard camera cut. If that reads worse than the stutter, raise it.
#
# LATCHED (`static const` in mesh_create_budget()), so it can only come from this file or the
# environment, never from the settings page mid-session.
PCSX2_REMIX_MESHBUDGET = 256
#
# READ BACK `mesh/frame peak +N` -- it should now be capped at 256 -- and then judge the frame
# time and the pop-in together. If the stutter is gone but the world arrives visibly late, the
# budget is too tight. If neither moves, the cost is the 723 draws themselves and no mesh knob
# reaches it; that needs the world camera, after which static geometry stops being re-submitted
# as new every frame.
#
# READ BACK `mesh/frame peak +N -N` and `meshes live`. If peak creations collapse, identity was
# the problem. If they do not move, registration is failing to match and IDCOLOR = 0 is next --
# vertex colour is folded into the hash by default, and Black's vertex colours carry its baked
# lighting, which is not constant per object.
#
# MESHCAP stays at 16384 for now: it is not the fix and it costs VRAM, but dropping it back to
# 4096 while the churn is unresolved only re-adds eviction pressure on top. Revisit once STABLEID
# has been read.
#
# Rule out the cheap thing first: MAXPROGRAMS = 64 and UCODEDUMP = 1 were BOTH ARMED during that
# session, and both run on the VU thread inside the XGKICK, which is squarely on the emulation
# path. They are disarmed above now. Re-measure before blaming the submission load.

# ---------------------------------------------------------------------------------------------
# THE SKY CAMERA IS NOT BROKEN -- IT IS UNREACHABLE. Do not spend a session on it.
# ---------------------------------------------------------------------------------------------
#
# The settings overlay for this title sets SKY = 2 and SKYCAM = true, and the stats line still
# reads `skycam 0`. That is not a failure of the sky path. In RemixSubmit.cpp the sky camera is
# submitted INSIDE the world-camera branch:
#
#     setup_camera_checked(&camera_info, "world", ...);
#     ++s_stats.cam_world;
#     if (sky_camera_enabled()) { ... sky_info.view[3] = 0; ... ++s_stats.cam_sky; }
#
# The sky camera IS the world camera with the translation stripped -- a skybox is a direction, not
# a place. With `cam world 0` that branch never executes, so `skycam 0` is arithmetic, not a bug.
#
# Nothing about the sky can be fixed on this title until the world camera solves, which is the
# slicer problem above. Same for injected lights: without a world camera there is no world to put
# them in.

# ---------------------------------------------------------------------------------------------
# GAME DATA, FROM THE SHIPPED FILES AND THE ELF (2026-09-24, read-only RE, file:offset evidence)
# ---------------------------------------------------------------------------------------------
#
# MISSIONS. Treneska Border Crossing is levels\level_01, internally 'Wilderness'. There is no
# level_02: missions map through the 12-entry table in GlobData.bin at 0x133000, and its unit
# counts match the Unit_NN.bin files on disk for all 8 real levels.
#
# LIGHTS: NO POINT OR SPOT LIGHTS -- A BAKED IRRADIANCE FIELD INSTEAD. The world is lit by
# *_SB_* lightmap pages (slot 1 of every two-texture material; 55 pages in level_01) plus
# per-vertex RGBA where 128 = 1.0. Objects lit at runtime sample a baked spherical-harmonic field:
# each Unit_NN.bin carries, at header +0x0C, a block {rel -> collision root, 12, count} followed
# by count 12-byte records -- 9 x int8 SH coefficients (1.7 fixed point; order L00 L1-1 L10 L11
# L2-2 L2-1 L20 L21 L22) then RGB -- one per collision-mesh vertex. The game raycasts straight
# down onto the collision mesh, lerps the hit triangle's three records, and builds the
# Ramamoorthi-Hanrahan irradiance matrix (sampler 0x0012C790, matrix 0x001AEBF8; all five R-H
# constants present). Verified on level_01\Unit_03.bin: 18,851 records ending exactly on the
# collision root, 99.46% L00-dominant.
#
# Remix has no SH-probe input, so the field cannot be injected as-is, and any light added for the
# static world double-lights it unless the bake is neutralised. What the field CAN give is the
# dominant light per region: the L1 band (L11, L1-1, L10 -> x, y, z) points toward the light,
# with the RGB as its colour -- the grounded version of what MOONFIT estimates from vertex
# colours. Like the sky it needs the world camera first; a world-space key light is meaningless
# while the scene is in view space.
#
# UNITS. Up axis Y; one unit is about one metre (a 2.74 ceiling, a 10.000-unit spatial grid).
# level_01 spans x -989..160, y -6..43, z -105..596.
#
# SKY: NOT GEOMETRY, AND NOT WHAT IS CURRENTLY TAGGED. Every frame the engine composites two
# textures, `clouds` (1024x256, 8-bit paletted) and `gradient` (32x32, 32-bit), into a 64x32
# OFF-SCREEN target with TEST_1 = 0x00031001 -- depth test ALWAYS, no Z write -- through the same
# 2D emitter the HUD uses (init 0x0016AE08, draws 0x0016B118 / 0x0016B4F8). That is the exact
# signature the default sky classifier keys on. The backend does decode the clouds texture:
# 884DCD5EAAE0ADC2 in remix_textures.txt is 1024x256 PSMT8H with a 256-colour CLUT. The two
# hashes in RemixGames\SLUS-21376\rtx.conf skyBoxTextures -- 5707C3FD6934FDB1 (128x128) and
# BDEB59A2E41218F7 (64x64), both 4-bit sharing one CLUT -- are some other texture. None of the
# sky can orient correctly before the world camera solves; once it does, either tag
# 884DCD5EAAE0ADC2 or replace the sky with Remix's own atmosphere. The per-level sky tint is
# LevelDat+0x378..0x380 (Wilderness 160,160,160).
#
# PER-LEVEL LIGHTING TONE-MAP -- not a colour grade, as an earlier version of this file said.
# LevelDat+0x354/358/35C are scale, gamma and an L00-only bias applied to the SH lighting of
# dynamic objects, +0x360/364/368 the same for static objects, and +0x36C..374 an RGB balance
# multiplied into the light colour. The nine 'coefficients' the debug page prints are the
# DEFAULT SH9 set (.rodata 0x003F42E0 = 48 37 5 -13 -8 1 -10 -8 3, /128: mostly ambient, lit
# from +Y). Read from the files: Wilderness is (0.30, 0.22, 0.26) dynamic and (0.47, 0.37, 0.16)
# static -- dimmer with a lifted ambient, a night map. level_00 carries a 0.3 L00 bias, and six
# of the eight levels have a non-identity static path. It shapes lighting, not the final image,
# so it matters when authoring Remix lights, not for tonemapping.
#
# EE CAMERA LEAD. The LOD/cull loop at 0x001B2790 compares object positions against a camera
# position at [0x0040F4D0] + 0xD0 -- a pointer in .bss, then an offset. A fallback if the slicer
# route fails; EECAM as written reads a fixed address and Unreal Euler angles, so it would need
# pointer-chasing and a matrix mode first.
#
# Also: the .awd files are AUDIO wads, not RenderWare. The ELF has no symbols; its 24 distinct
# VU1 microprograms are embedded as .DVP.overlay sections.


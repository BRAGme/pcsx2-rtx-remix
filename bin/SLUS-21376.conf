# Black (SLUS-21376, NTSC-U, CRC 5C891FF1)
#
# Read by remix_ps2::materials at frame boundaries. An existing environment variable always beats
# this file -- including one the PCSX2 GUI writes into gamesettings\SLUS-21376_<crc>.ini -- so if
# the log says "SKIPPED (already set in the environment)" for the line below, set "Sprites are
# geometry" in the Remix settings page for this game instead, or delete that key from the .ini.
#
# PROVENANCE: created 2026-09-24 from ONE user-supplied emulog.txt (build
# remix-preview-3-8-g9a644291a), the main menu only. Nothing here has been rendered or A/B'd on
# this title; the counters below are copied from that log, the fix is not yet confirmed. Needs
# proper testing.


# ---------------------------------------------------------------------------------------------
# THE MENU: its draws are sprites, and sprites are refused by default.
#
# MEASURED on this title, main menu, frame 37800 (~637 s into the run):
#   seen 397478 | submitted 36766 | skip: tri 287705 untex 73007
#   cam world 0 fallback 37800 | vu kicks 0 | unique content 5 tex0 5
#
# "tri" counts draws refused at the primclass gate for NOT being triangles -- sprites, lines,
# points. 287705 of 397478 (72%) of the menu's draws never reached Remix, which is the same
# signature the PS2 BIOS menu had before SPRITE3D (see 20080220-175343.conf): a 2D screen drawn
# as GS sprites, refused wholesale, and the handful of triangles that survive rendered on their
# own.
#
# SPRITE3D expands each textured sprite into a quad and submits it as geometry. Untextured
# sprites and ones whose texture fails to bind are still refused, so it cannot add full-screen
# blits.
#
# HOW TO TELL IT WORKED, rather than assuming: on the menu, "tri" should stop being the majority
# of "seen", "sprite3d ... draws" on the overlay stats line should go above 0, and "submitted"
# should rise by about as much as "tri" falls. If "tri" stays high, the menu's draws are lines or
# points rather than sprites, and this line is not the fix.
#
# NOT COVERED: the 73007 "untex" skips. Those wait on a Z->w fit that has 0 vertices on the
# menu, because there are no perspective textured triangles there to calibrate from. That is
# expected on a 2D screen and is left alone until it is measured in a mission.
PCSX2_REMIX_SPRITE3D = 1

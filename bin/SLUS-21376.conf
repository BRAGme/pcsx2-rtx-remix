# Black (SLUS-21376) -- Criterion, RenderWare-derived engine
#
# UNSOLVED, and this file exists to take the next measurement rather than to configure a working
# title. Read the whole thing before adding knobs: three plausible readings of the symptom were
# tested against the source and all three were wrong.
#
# THE SYMPTOM: no world camera is ever recovered. Every frame falls back, so the whole scene is
# submitted in the view-space tier and nothing is anchored in the world.

# ---------------------------------------------------------------------------------------------
# THREE READINGS THAT LOOK RIGHT ON THE STATS LINE AND ARE NOT
# ---------------------------------------------------------------------------------------------
#
# 1. `REFUSED 0` DOES NOT MEAN NOTHING WAS REFUSED. On the first stats line REFUSED binds to
#    s_stats.cam_failed -- calls where SetupCamera itself returned non-SUCCESS -- and it is
#    incremented only inside setup_camera_checked(). With `world 0` it is structurally incapable
#    of being anything but 0. It says nothing about the election.
#
#    The election's refusals are on the SECOND stats line: cand, split-reject, score-reject,
#    degenerate-reject, scale-reject, extent-reject, accept. That is the line to read.
#
# 2. `maxpos 2 / scene r 1` IS NOT EVIDENCE ABOUT THIS GAME. With no valid camera, flat draws are
#    classified fallback_screen_ui, which forces q = 1 and routes them through the view-space
#    branch. A screen of w=1 quads produces maxpos ~2 and scene r 1 BY CONSTRUCTION. It is a
#    consequence of having no camera, not a clue about why.
#
# 3. THE COUNTERS ARE CUMULATIVE, NOT PER-FRAME. `frame 1800 | seen 11318 submitted 1446` is 1,446
#    draws submitted IN TOTAL across 1,800 frames -- 0.8 per frame -- not 1,446 per frame. s_stats
#    is reset only at Close. Two of the three logged Black sessions never left the menu at all
#    (`vu kicks 0 ... programs 0/0` for their whole duration), so they measured nothing.
#
# CHECK `scene r` FIRST ON ANY BLACK LOG. If it reads 1, the run stayed in the menu and every
# other number in it is void. The one session that did reach a level read `scene r 325`.

# ---------------------------------------------------------------------------------------------
# WHAT THAT ONE IN-LEVEL SESSION ACTUALLY SHOWED
# ---------------------------------------------------------------------------------------------
#
#   maxpos 380/400000 | scene r 325
#   submitted w (max per draw): <0.1 174  <1 34700  <10 5979  <100 131890  >=100 427697
#
# 427,697 draws at max w >= 100, spanning four orders of magnitude. Black emits a genuine
# perspective Q -- there IS a world transform in there to recover. This is not a game that hands
# the GS pre-transformed coordinates, which was the other candidate explanation.
#
#   vu kicks 6736 scanned 6736 reentrant 0 windows 0 shape-ok 0 |
#   programs 8/8 REFUSED 1990 (last pc=0x02d0 ucode=0xfff85e34d458658b) |
#   slice matrices 0 published 0 | cand 0 (now 0) | ... accept 0
#
# It dies before the election, three ways at once:
#   windows 0 / shape-ok 0  the exhaustive shape scan never ran (SCANWINDOWS, see below)
#   programs 8/8 REFUSED 1990  the program table saturated at the DEFAULT OF 8, so 1,990 kicks
#                              hit entry points the slicer never even looked at
#   slice matrices 0  the 8 that were analysed yielded no decodable matrix
#
# Then resolve_world_camera() takes an uncounted early return -- one `return` shared by four
# distinct causes -- on the `frame.count == 0` arm, drop_stale_camera() clears the camera, and
# submit_camera() falls back. `cand 0` is what pins the arm: the candidate count is accumulated
# ABOVE that gate, so a zero there means no candidate was ever produced.

# ---------------------------------------------------------------------------------------------
# THE MEASUREMENT THIS FILE TAKES
# ---------------------------------------------------------------------------------------------
#
# MAXPROGRAMS is the discriminator: it separates 'the slicer never saw Black's matrix code' from
# 'it saw it and cannot decode it'. Those two answers have completely different costs -- the first
# is a config change, the second is new code -- and nothing measured so far distinguishes them.
#
# 64 is the hard cap in RemixVU1Capture.cpp, not a round number. SCUS-97545.conf already runs at
# 32, so the knob is known to work from a per-game conf: it is read on every cache miss, not
# latched.
#
# MEASUREMENT TAKEN 2026-09-24, AND IT ANSWERED. Both knobs are DISARMED again below: they have
# done their job, and leaving them on costs VU-thread time on every cache miss for nothing.
# PCSX2_REMIX_MAXPROGRAMS = 64
# PCSX2_REMIX_UCODEDUMP = 1

# ---------------------------------------------------------------------------------------------
# THE RESULT: BLACK NEEDS CODE, NOT CONFIGURATION. This is settled, not a hypothesis.
# ---------------------------------------------------------------------------------------------
#
# Over a 444-second, 18,600-frame session that reached gameplay:
#
#   vu kicks 193110 scanned 193110 reentrant 0 windows 0 shape-ok 0 | programs 38/64 |
#   slice matrices 0 published 0 | cand 0 (now 0) | split-reject 0 score-reject 0
#   degenerate-reject 0 scale-reject 0 extent-reject 0 accept 0 (sliced 0) | camera view-space
#
# Read it against the three outcomes this file used to list:
#
#   programs 38/64 -- NOT saturated. The default of 8 was saturating at REFUSED 1990; at 64 the
#     table has headroom and REFUSED is gone entirely. So the cap was real, and raising it was
#     necessary to learn anything -- but it was not sufficient, and it was not the answer.
#
#   slice matrices 0 -- THIS IS THE ANSWER. All 38 distinct entry points were analysed and NONE
#     of them decodes. That is the expensive branch: the back-slicer's idiom does not match what
#     Black's microcode does. cand 0 and accept 0 follow from it; there was never anything to
#     elect. No knob fixes this.
#
# WHAT TO DO NEXT, and the material is already on disk: UCODEDUMP wrote 38 dumps while it was
# armed -- logs/remix_ucode_*.bin with their disassembled entry points in the matching
# remix_ucode_*_pc*.txt. That is the input to teaching the slicer Black's idiom, and it does not
# need another run to collect.
#
# RemixVU1Slice.h documents what the slicer currently requires: the canonical
# MULAx / MADDAy / MADDAz / MADDw matrix-vector idiom plus a decodable LQ/LQI/LQD base. Whatever
# Black does instead is in those 38 files.
#
# Do NOT re-run the MAXPROGRAMS measurement. It is answered. Anything further starts from the
# dumps.

# ---------------------------------------------------------------------------------------------
# THE MICROCODE IS NOW REVERSE-ENGINEERED. Black transforms vertices like this:
# ---------------------------------------------------------------------------------------------
#
# From remix_ucode_9ecb2e12be7f935b.bin, entry 0x0458, chain at 0x0b68:
#
#     0x0b68  MULA x   fs=vf23  ft=vf03
#     0x0b70  MADDA y  fs=vf24  ft=vf03
#     0x0b78  MADDA z  fs=vf25  ft=vf03
#     0x0b80  MADD w   fs=vf26  ft=vf00   -> vf05
#
# That is EXACTLY the canonical idiom the slicer looks for. The idiom was never the problem.
# The problem is where the four rows come from.
#
# WHY THE SLICER CANNOT READ IT. It resolves a row only if the register was filled by an LQ/LQI/
# LQD near the chain (vf_load[fs]). Scanning all nineteen of Black's 16 KB images for any load
# into vf20..vf27 returns ZERO. Not one. The rows are never loaded -- they are COMPUTED, two
# matrix multiplies deep:
#
#     LQ vf03 <- qword 1000        loads from VU data memory
#     LQ vf04 <- qword 1001
#     LQ vf05 <- qword 1002
#     LQ vf09 <- qword 1016
#     LQ vf10 <- qword 1017
#         |
#         v  0x0310-0x0360  MADDz vf28 <- vf09 x vf03,  vf29 <- vf09 x vf04, ...
#     vf28..vf31   a concatenated matrix, built on VU1
#         |
#         v  0x07b0-0x0828  MULz/MUL  vf24 <- vf28 x vf19,  vf25 <- vf29 x vf19, ...
#     vf24..vf27   the rows the vertex chain actually uses
#
# So the slicer's def-use tracking stops one step too early by design: it has no path through
# ALU ops, only through loads. Every row reads as unknown, `found` comes out 0 or a partial 1..3,
# and the chain is filed as register-resident or rejected as `unsliced`. That is the whole of
# `slice matrices 0`. It is structural. Raising any cap cannot reach it.
#
# THE VU1 CONSTANT-AREA MAP, counted over all nineteen images (qword -> how many of the 19
# distinct programs load it):
#
#     qword 1000..1002    4-5 programs     per-object / world rows
#     qword 1004, 1006    11-16 programs   heavily re-read, scalars not a matrix
#     qword 1014..1017    19 of 19         <-- every program, four consecutive qwords
#     qword 1018..1021    19 of 19         <-- every program, four consecutive qwords
#
# Every vertex program needs the view-projection and nothing else is universal, so one of those
# two four-qword blocks is almost certainly it. That is the inference; the load counts are the
# measurement.

# ---------------------------------------------------------------------------------------------
# THE EXPERIMENT THIS ENABLES -- NO CODE, ONE KNOB, TWO RUNS
# ---------------------------------------------------------------------------------------------
#
# PINOFFSET reads a matrix straight out of VU1 data memory at an address you name, bypassing the
# slicer entirely. It takes a BYTE offset, it is validated as (offset + 64) <= 16384, and
# refresh_user_pin() re-reads it from this file every frame -- so it is not latched and a per-game
# conf genuinely reaches it.
#
# Byte offset = qword * 16. The two candidates:
#
#     qword 1014  ->  PCSX2_REMIX_PINOFFSET = 16224
#     qword 1018  ->  PCSX2_REMIX_PINOFFSET = 16288
#
# Try 16224 first -- it is the lower of the two universal blocks and the one vf09/vf10 are drawn
# from at 1016/1017.
PCSX2_REMIX_PINOFFSET = 16224
#
# THEN READ, in this order:
#   1. `cand N` on the second stats line. If it is still 0, the pin was not even inserted --
#      check the value is in range and that no environment variable is overriding this file.
#   2. `accept` and `cam world`. Non-zero cam world means a camera was elected from the pin.
#   3. `scene r`. It must be in the hundreds; 1 means the run never left the menu and measured
#      nothing, which has already wasted two sessions on this title.
#   4. Then LOOK AT IT. An elected camera that is the wrong matrix still elects. Geometry that
#      holds still while the eye turns is right; geometry that swims with the view is a world
#      matrix rather than the view-projection -- in which case try 16288.
#
# If neither block elects, the remaining route is a def-use walk through ALU ops in the slicer,
# so a computed row can be traced back to the loads that fed it. That is real work -- the trace
# above is two multiplies deep and would need constant-folding -- but it is now a known quantity
# rather than an open question, and these two runs are much cheaper than starting it.

# ---------------------------------------------------------------------------------------------
# A SECOND, INDEPENDENT MEASUREMENT IN THE SAME RUN
# ---------------------------------------------------------------------------------------------
#
# Black's intro movie is the reproduction case for the .PSS defect: the movie plays, and Remix is
# handed an essentially empty scene. Measured on a 2,700-frame session -- 1 instance, 0 lights,
# 1,812 draws submitted in total, black screen.
#
# MOVIE presents the emulator's own merged output over the traced image while the IPU reports an
# active movie, composited AFTER path tracing. It reads the merged frame rather than the draw
# stream, so it catches both the sprite-blit style and the upload-straight-to-DISPFB style.
#
# It touches nothing the camera work above measures -- different subsystem, different counters --
# so one run answers both questions.
#
# READ IT BACK on the overlay stats line:
#     movie 1 active 1 decodes N presented M refused 0
# presented climbing while a movie plays is the fix working. refused climbing instead means the
# readback is failing -- the display size or the merged texture, not the gate. active 0 with the
# movie visibly playing means the IPU hook never fired and the fault is upstream of all of this.
#
# EXPECT IT TO LOOK LIKE ORDINARY EMULATOR OUTPUT. That is correct and not a bug: pre-rendered
# video must not be path traced, or it would be denoised and temporally accumulated, which smears
# motion. This is compositing, not tracing.
#
# CONFIRMED WORKING 2026-09-24: `movie 1 active 0 decodes 3551856 presented 2938 refused 0`.
# 2,938 frames presented, nothing refused.
PCSX2_REMIX_MOVIE = 1

# ---------------------------------------------------------------------------------------------
# OPEN: gameplay runs in slow motion. This is EMULATION speed, not frame rate -- the renderer
# reports 68-79 FPS at 12-14 ms while the game itself crawls, which is the GS thread holding up
# MTGS and the EE waiting on it.
# ---------------------------------------------------------------------------------------------
#
# Black is a far heavier submitter than anything else this backend has been tuned against.
# Measured on the same session:
#
#   seen 13,004,834   submitted 11,736,997 over 18,600 frames  =  631 SUBMITTED DRAWS PER FRAME
#   material binds 11,891,765, of which 20,091 ms -- twenty seconds of the session -- was hashing
#   meshes live 4096, i.e. PINNED AT THE CACHE CAP, with +1,348,523 / -1,344,427 lifetime
#     creates/destroys: about 72 created and 72 destroyed EVERY FRAME
#
# A mesh create is a BLAS build, and `meshes live 4096` is EXACTLY the MESHCAP default -- the
# cache is not merely full, it is pinned at the cap and evicting something every time it wants
# something new. 72 evictions and 72 BLAS builds per frame is the shape of a cache that is too
# small for the content, not of a game creating genuinely new geometry.
#
# WHY THIS SHOWS UP AS SLOW EMULATION RATHER THAN LOW FPS: mesh creation runs on the GS thread.
# When the GS thread is busy, MTGS backs up, and the EE waits on MTGS. The renderer keeps
# presenting at 68-79 FPS -- which is why the frame counter looks healthy -- while the guest
# machine behind it runs slow. That is exactly the symptom reported.
#
# ARMED AS A CANDIDATE, NOT AS A FIX. 4x the default, well under the 65536 maximum. It trades
# VRAM and a larger TLAS for fewer BLAS builds, so it is not free and it is not obviously right --
# it is the one-run experiment.
#
# READ IT BACK on the frame stats line:
#   meshes live <N> (+created -destroyed)
# If live settles BELOW 16384 and the create/destroy rate collapses, the cache was the problem.
# If it pins at 16384 too and the rate is unchanged, Black really is producing that much distinct
# geometry, raising it further is the wrong lever, and the next things to look at are STABLEID
# (matches meshes by rigid registration instead of hashing positions, so a mesh that moved is not
# a new mesh) and MESHIDLE.
#
# MESHCAP LATCHES on first call -- `static const` in mesh_live_cap() -- so it can only be set from
# this file or the environment, never from the settings page mid-session.
PCSX2_REMIX_MESHCAP = 16384
#
# Rule out the cheap thing first: MAXPROGRAMS = 64 and UCODEDUMP = 1 were BOTH ARMED during that
# session, and both run on the VU thread inside the XGKICK, which is squarely on the emulation
# path. They are disarmed above now. Re-measure before blaming the submission load.

# ---------------------------------------------------------------------------------------------
# THE SKY CAMERA IS NOT BROKEN -- IT IS UNREACHABLE. Do not spend a session on it.
# ---------------------------------------------------------------------------------------------
#
# The settings overlay for this title sets SKY = 2 and SKYCAM = true, and the stats line still
# reads `skycam 0`. That is not a failure of the sky path. In RemixSubmit.cpp the sky camera is
# submitted INSIDE the world-camera branch:
#
#     setup_camera_checked(&camera_info, "world", ...);
#     ++s_stats.cam_world;
#     if (sky_camera_enabled()) { ... sky_info.view[3] = 0; ... ++s_stats.cam_sky; }
#
# The sky camera IS the world camera with the translation stripped -- a skybox is a direction, not
# a place. With `cam world 0` that branch never executes, so `skycam 0` is arithmetic, not a bug.
#
# Nothing about the sky can be fixed on this title until the world camera solves, which is the
# slicer problem above. Same for injected lights: without a world camera there is no world to put
# them in.

# ---------------------------------------------------------------------------------------------
# HOW TO READ THE RESULT
# ---------------------------------------------------------------------------------------------
#
# Confirm the conf was applied at all -- grep for the '(per-game conf)' suffix:
#     Remix: PCSX2_REMIX_MAXPROGRAMS = 64 (per-game conf)
# An environment variable already set by the launching shell always beats this file and the conf
# silently loses, so do not also export these when testing.
#
# Then, on the LAST stats block of a run that reached a level (scene r in the hundreds):
#
#   programs N/64, N < 64, REFUSED 0, slice matrices > 0
#     The cap was the whole problem. Candidates exist now -- move on to the election counters
#     on the second stats line, which is a kind of problem this project has solved before.
#
#   programs N/64, REFUSED 0, but STILL slice matrices 0
#     Definitive, and it is the expensive answer: every entry point was analysed and none
#     decodes, so the slicer's idiom does not match Black. Go to the remix_ucode_*_pc*.txt dumps
#     UCODEDUMP just wrote. Do not start here -- this branch is unbounded without them.
#
#   programs 64/64 and REFUSED still in the thousands
#     Black has more than 64 distinct (ucode, start_pc) entry points. Raising the cap is a code
#     change. Before that, see SCANKICKS below -- you are currently measuring through a censor.

# ---------------------------------------------------------------------------------------------
# TWO KNOBS THAT CANNOT LIVE IN THIS FILE
# ---------------------------------------------------------------------------------------------
#
# SCANKICKS caps how many XGKICKs per frame the camera scan examines. Default 16. It is latched
# once in SetArmed(), before a per-game conf is read, so it has to go in the PCSX2 settings
# overlay instead -- gamesettings\SLUS-21376_5C891FF1.ini, section [Remix]:
#
#     [Remix]
#     SCANKICKS = 4096
#
# It is not only a tuning knob here, it is a MEASUREMENT PROBLEM: `publish()` runs after the
# budget gate, so `vu kicks` on the stats line is itself censored at SCANKICKS. The 16.00/frame
# those Black logs report is the cap, not Black's rate. At ~1,500 draws/frame the real number is
# certainly far higher -- Rainbow Six 3 issues ~1,230 -- and you cannot currently see it.
# On Rainbow Six 3 this knob alone moved the world-anchored median from 27.5% to 64.9%.
#
# SCANWINDOWS turns on the exhaustive 16 KB shape scan -- the ONLY generic mechanism for finding
# an unknown camera address. It is a namespace-scope `const bool` initialised at static-init time,
# before main, and it is not in the GUI knob table either, so neither this file nor the settings
# overlay can reach it. Only a real process environment variable set before launch can.
#
# That is the hole in the discovery loop: the one knob that finds an unknown camera is the one a
# per-game profile cannot turn on. Un-latching it is about five lines -- read it per kick into a
# local, exactly as SLICEVF and SLICEAUTO already are -- and it would convert most of the rest of
# this problem into configuration. The file's own comment already flags the defect.

# ---------------------------------------------------------------------------------------------
# NOT WORTH TRYING YET
# ---------------------------------------------------------------------------------------------
#
# EECAM reads the camera out of EE main memory and is what Rainbow Six 3 needed, its camera not
# being in VU1 at all. It will NOT serve Black as written: the generic path hardcodes an Unreal
# FRotator -- three int32 16-bit turn angles -- and Black, on a RenderWare-derived engine, will
# hold an RwMatrix of floats instead. That would need an EECAMMAT mode, ~80-150 lines. But it is
# only worth writing once the ADDRESS is known, and finding the address is the actual problem.
# (RenderWare inferred from the engine lineage, not from any disassembly -- treat as a lead.)
#
# Note all env values here parse BASE 10, so addresses go in decimal, not hex.

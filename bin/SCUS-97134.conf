# SOCOM: U.S. Navy SEALs (SCUS-97134)
#
# Minimum viable config to get the 1-in-3 shattered-frame fix working on this title.
#
# PCSX2_REMIX_BATCH defaults to 0 (RemixSubmit.cpp batch_mode()), and the hold-empty fix
# rides the batch path ONLY -- under BATCH = 0 it counts empty windows and holds nothing.
# MEASURED on this title before this file existed: `empty windows 1319 held 0 instances 0`
# -- the empty windows were detected and never held, so the flicker survived.
#
# The flicker itself is engine-independent: the game renders below the vsync rate, so every
# Nth presented window submits zero geometry and presents an empty scene. HOLDEMPTY = 2
# re-presents the previous window (geometry AND camera) so the held frame is a true
# duplicate -- what stock PCSX2 does when it re-blits identical pixels on a duplicate vsync.
PCSX2_REMIX_BATCH = 1
PCSX2_REMIX_HOLDEMPTY = 2

# Keep dynamic batch meshes alive while Remix finishes its async ray-tracing build.
# Three frames produced VK_ERROR_DEVICE_LOST on turns during Combined Assault testing.
PCSX2_REMIX_BATCHRETAIN = 16

# DISARMED. These three lines armed a per-draw state dump while the sky quads were being
# read (2026-08-15); the numbers that dump produced are recorded below and the dump has done
# its job. It is left here commented rather than deleted because retuning SKYMINW on this
# title needs it again -- uncomment all three to get d=202's own w range back.
#
# DRAWDUMPAFTER puts the dump in GAMEPLAY: arming on "the first frame that qualifies" lands
# on mission start, which on Combined Assault described a scene nobody was asking about.
# This title has SKY = 1 in its overlay and mode 1 matches nothing here, so nothing is tagged
# sky=1. Find the sky by SIGNATURE instead: depth(r=1 w=0), target=1, low d= ordinal.
# PCSX2_REMIX_DRAWDUMP = 4
# PCSX2_REMIX_DRAWDUMP_WORLD = 1
# PCSX2_REMIX_DRAWDUMPAFTER = 900

# The upside-down sky. MEASURED from a gameplay draw dump (frames 1789-1795):
#   d=0  verts=3024 tris=470  depth(r=0 w=0)  sky=1  rt=256x256
#        mat=554E544558545244 (ASCII "UNTEXTRD")  uv=[0,0]x[0,0]  w=[0.0156, 62070]
# The sky dome is drawn into a 256x256 OFF-SCREEN render target -- exactly one draw per
# frame, the only thing using that target; all 1,028 other draws go to the main 640x448.
# Un-projecting an off-screen pass with the MAIN camera is meaningless, which is why its w
# spans 0.0156..62,070 in a single draw and why it lands in the world inverted.
# Same root cause as Combined Assault geometry scatter (a 128x128 RTT submitted as world
# geometry); the fix there was this same gate.
#
# The gate is `(rt_w * rt_h) < MINRT`, STRICTLY less than, so CA value 65536 would NOT catch
# a 256x256 target whose area is exactly 65536. Must sit in (65536, 286720].
PCSX2_REMIX_MINRT = 131072

# Sky by depth. This title's backdrop is d=202, 144 verts / 48 tris, maxw 5615, covering
# more than twice the framebuffer. 1000 is EXTRAPOLATED, not measured: CA's dome has
# min/max = 0.33, so a min near 1850 is implied and 1000 sits below it with room.
# Re-arm the DRAWDUMP lines above and retune from d=202's own w=[min,max], not from this guess.
PCSX2_REMIX_SKY = 4
PCSX2_REMIX_SKYMINW = 1000

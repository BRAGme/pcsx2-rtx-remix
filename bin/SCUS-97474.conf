# SOCOM 3: U.S. Navy SEALs (SCUS-97474)
#
# Starter profile. NOTHING BELOW HAS BEEN MEASURED ON THIS TITLE -- every value is
# transplanted from SOCOM: U.S. Navy SEALs (SCUS-97134.conf) and SOCOM: Combined Assault
# (SCUS-97545.conf), where they were measured. SOCOM 3 is the same Zipper Interactive engine
# family, so the mechanism is expected to carry, but confirm against this game's own counters
# before quoting any of it as fact.
#
# There is deliberately no gamesettings overlay for this serial. Do NOT open the Remix
# settings page while this title is loaded -- doing so serialises the whole GUI knob state
# into gamesettings\SCUS-97474_<hash>.ini, which reaches the backend through the environment
# BEFORE this file is read, and every line here then logs as "SKIPPED (already set in the
# environment)".

# The 1-in-3 shattered-frame fix.
#
# PCSX2_REMIX_BATCH defaults to 0 (RemixSubmit.cpp batch_mode()), and the hold-empty fix
# rides the batch path ONLY -- under BATCH = 0 it counts empty windows and holds nothing.
#
# The flicker itself is engine-independent: the game renders below the vsync rate, so every
# Nth presented window submits zero geometry and presents an empty scene. HOLDEMPTY = 2
# re-presents the previous window (geometry AND camera) so the held frame is a true
# duplicate -- what stock PCSX2 does when it re-blits identical pixels on a duplicate vsync.
#
# HOW TO TELL IT DID ANYTHING HERE, rather than assuming: read the empty/held/gap3 counters.
# If "empty windows" is ~0, this title does not have the below-vsync problem and these two
# lines are inert -- in which case any flicker is a DIFFERENT fault and this is not the fix.
PCSX2_REMIX_BATCH = 1
PCSX2_REMIX_HOLDEMPTY = 2

# Keep dynamic batch meshes alive while Remix finishes its async ray-tracing build.
# Measured on Combined Assault: three frames produced VK_ERROR_DEVICE_LOST on camera turns.
# Coupled to HOLDEMPTY, which re-draws a previous batch and so depends on it still being
# alive -- shipping HOLDEMPTY without this is not a safe transplant.
PCSX2_REMIX_BATCHRETAIN = 16

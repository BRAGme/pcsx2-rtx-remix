# Red Dead Revolver (USA) -- SLUS-20500
#
# Opened from https://github.com/BRAGme/pcsx2-rtx-remix/issues/1, which reported a black screen
# and a crash on preview 3. On the current build the world renders: terrain, characters, sky and
# foliage all place correctly, at 120 fps on a 4070 Ti. What did NOT render was the menu UI.
#
# ---------------------------------------------------------------------------------------------
# THE MENU UI HAD NO MATERIALS, BECAUSE ITS SOURCE IS A RENDER TARGET
# ---------------------------------------------------------------------------------------------
#
# Measured over two boots of the same disc, one per setting, reading the stats line:
#
#                              RTTEX = 0        RTTEX = 1
#     screen-ui nomat          1440             4
#     nomat per present        0.20             0.00
#     mat skip: target         3293             1459
#     rt snapshots             0                1
#
# `nomat` counts draws that were classified as screen UI and then found no material to draw with,
# so they contribute nothing. `skip: target` is the reason: the material bind refuses a source
# that is a render target unless RTTEX admits it. Red Dead Revolver composes its menus out of
# render targets, so with the default the UI is recognised, admitted to the rasteriser, and then
# drawn with nothing.
#
# This is the same fault, and the same fix, as the PS2 system menu -- see the note in
# 20080220-175343.conf. The snapshot path that reads those targets back only became safe once it
# started refusing formats the readback cannot write (3134ab371); before that it corrupted
# neighbouring textures, which is why RTTEX is not simply on by default.
# RTTEX IS OFF, AND THE TEXT ABOVE IS KEPT AS THE RECORD OF WHY IT SHOULD NOT BE ON.
#
# Turning it on made the render-target snapshot run, and the snapshot produces WRONG CONTENT
# for this game. The whole frame became smeared bands of unrelated colour -- the signature of
# a palette lookup through the wrong bytes -- at every timestamp sampled from 45 s to 150 s.
# With RTTEX back to 0 the same boot renders terrain, the player with a cast shadow, trees,
# buildings, the HUD and readable sprite text, at 61 instances and 156 surface materials.
#
# The addressing bug behind the old refusal IS fixed (377fac7bd: the write-back now uses the
# STORAGE format instead of the sampling one), and that was verified byte-identical on the
# PS2 menu and Black. Fixing the ADDRESS did not make the CONTENT right for a 32-bit target
# read as an 8-bit index -- the CLUT side of it is still wrong -- so this stays off until
# that is understood rather than guessed at. RTA de-correction was tried and was not it.
#
# The cost of leaving it off is that draws sourced from render targets have no material.
# An absent element is better than a frame of noise.
PCSX2_REMIX_RTTEX = 0
#
# READ BACK `screen-ui seen N nomat M` on the overlay stats line. M should be near zero.
#
# RTTEX ALONE DID NOT FIX THE MENU. It fixed what it was measured against -- nomat went 1440
# to 0 -- and the menu still looked wrong, because `nomat` was a real defect but not the one
# that was hiding the menu. Recorded rather than quietly replaced: a counter moving is not the
# same as the picture changing, and this one moved all the way to zero while nothing improved.

# ---------------------------------------------------------------------------------------------
# THE MENU IS SPRITES, AND SPRITES NEED UIMODE
# ---------------------------------------------------------------------------------------------
#
# `skip: tri 28754` on the frame line is the tell. That counter is skip_not_triangle, and the
# gate it comes from is the FIRST one in the submit path -- roughly 900 lines before anything
# classifies a draw as screen UI. PS2 menus and text are drawn as SPRITES, not triangles, so
# they hit that gate first.
#
# Sprites are let past it only as overlay candidates, and that test reads:
#
#     sprite_ui_probe = sprite_class && m_process_texture && ui_mode() != 0 && ui_raster_mode() != 0
#
# UIRASTER is 1 by default now, but UIMODE is not -- so on a title without a profile every
# sprite in every menu is discarded before the UI path exists. That is the menu.
PCSX2_REMIX_UIMODE = 1
#
# READ BACK `skip: tri` on the frame line. It should fall sharply. If it does not, the sprites
# are being refused for a different reason and UIWMAX is the next suspect.

# ---------------------------------------------------------------------------------------------
# .PSS VIDEO IS OPT-IN, NOT AUTOMATIC
# ---------------------------------------------------------------------------------------------
#
# The merged-frame overlay that renders .PSS was generalised off Rainbow Six 3 (564d00cf5), but
# generalising the CODE did not enable it: PCSX2_REMIX_MOVIE still defaults to 0, so every
# title without a profile silently presents no video at all. The log says so plainly --
#
#     movie 0 active 0 decodes 1014701 presented 0 refused 0
#
# one million frames decoded by the guest, none presented.
PCSX2_REMIX_MOVIE = 1
#
# READ BACK `movie 1 active 1 ... presented N` during an FMV. N climbing is the video landing.

# ---------------------------------------------------------------------------------------------
# WHAT IS NOT SETTLED
# ---------------------------------------------------------------------------------------------
#
# THE REPORTED BLACK SCREEN AND CRASH DID NOT REPRODUCE HERE, and one attempt to claim it did was
# a measurement error: a window capture returned identical frames and was read as "nothing is
# rendering", while the log for that same run showed materials climbing from 0 to 70,627 binds
# and 55,709 draws submitted. The run was fine; the capture was not. Recorded because the next
# person to chase this will be tempted the same way -- trust the stats line, not a screenshot.
#
# The reporter's crash is `VK_ERROR_DEVICE_LOST` about three minutes in, on a different GPU
# (RTX 5060) and a different runtime (stock `remix-main+196a05b5`, not the Remix Plus build this
# backend is built against). Device loss is a known open fault on this backend -- see the
# `0x60D0DEAD` note in the README -- and it has not been root-caused on any title.
#
# Nothing here is tuned for lighting or sky.

# ---------------------------------------------------------------------------------------------
# THE WORLD CAMERA IS A MATRIX IN EE MEMORY, NOT IN VU1
# ---------------------------------------------------------------------------------------------
#
# An earlier note here said the camera was "whatever the VU1 path recovers by default, and it
# places geometry correctly". BOTH HALVES WERE WRONG. The stats line read `cam world 0 fallback
# N` for every frame of every run -- nothing was ever recovered, the fallback camera was drawing
# the whole game, and the geometry looked right only because a fallback camera in view space
# looks plausible until something moves.
#
# The VU1 slicer is a dead end on this title. Three arms were measured:
#
#     default                    programs 6/8     slice matrices 0   cand 0
#     MAXPROGRAMS=64             programs 6/64    slice matrices 0   cand 0
#     MAXPROGRAMS=64 SLICEW0=1   programs 5/64    slice matrices 0   cand 0
#
# So the camera was found in EE memory instead, the way Rainbow Six 3 was -- except that R6-3
# needed a human making save states in controlled poses, and this title has an attract demo that
# moves its own camera. PCSX2_REMIX_EEDUMP snapshots all 32 MB of EE RAM on a frame timer, and
# the demo supplies the motion with nobody at the controller.
#
# THE FIRST CAPTURE WAS WASTED AND IT IS WORTH SAYING WHY. Eight snapshots from frame 0, seven
# seconds apart. The run log reads `submitted 0` on every stats line through frame 1500, so four
# of the eight held no world geometry at all and could not possibly contain a world camera; the
# surviving four were too far apart to tell a camera from a matrix that simply sits still. What
# it did produce was a filter that selects only things that never change: thirteen candidates,
# all of them static identity matrices.
#
# The second capture started at frame 6000 -- chosen by reading `submitted` off the stats line --
# and sampled every 30 frames. Then:
#
#     orthonormal 3x3 in all ten snapshots           1948 offsets
#     ALSO turning smoothly between neighbours          2 offsets
#
# Orthonormality alone is weak, because every static mesh normal and every parked transform
# passes it. CONTINUITY is the discriminator. The two survivors were one matrix and a copy of
# it, and the address below also appears in the first capture, from a separate boot.
#
# The matrix is affine, row-major, rows padded to 16 bytes:
#
#     +0x00  right  (-0.2841,  0.0000,  0.9588)  w=0   y is EXACTLY zero -- it never rolls
#     +0x10  up     ( 0.0645,  0.9977,  0.0191)  w=0   +Y is up
#     +0x20  fwd    (-0.9566,  0.0673, -0.2835)  w=0   equals right x up, so right-handed
#     +0x30  pos    (-7.7341, -3.1742, 18.2900)  w=1   sweeps smoothly, height barely moves
#
# EECAMMAT IS DECIMAL, NOT HEX. read_env_int parses base 10 only, so 0x00CABAC0 would parse as
# 0 and silently turn the camera off. 0x00CABAC0 = 13286080.
PCSX2_REMIX_EECAM = 2
PCSX2_REMIX_EECAMMAT = 13286080
#
# Measured with these set, over a 170 s boot-to-demo run:
#
#     cam world 6877 fallback 2723    (was `cam world 0 fallback N` for the entire run)
#     EECAM matrix ... used 6998      installed every frame once the demo starts
#     EECAM read FAILED               5, all during the menu, before the matrix is populated
#
# The fallback count freezes at 2723 -- the logos, the .PSS and the title menu -- and the world
# camera takes over from there. Position and yaw move smoothly frame to frame (yaw -118.5 to
# -104.7 over four seconds). The picture is a correct third-person view: level horizon, coherent
# perspective, the player casting a shadow onto path-traced ground.
#
# READ BACK `cam world` on the frame line. It must CLIMB. If it stops while the picture keeps
# moving, the address has gone stale -- see below.
#
# WHAT IS NOT ESTABLISHED:
#
# - THE ADDRESS MAY NOT SURVIVE A LEVEL CHANGE. It held across two boots of the same attract
#   demo. That is all that was tested. It is an address in a heap this game owns, not a symbol.
#   The reader refuses any basis that is not a rotation, so a stale address degrades to the old
#   fallback camera rather than to a wrong world -- but it will degrade.
# - THE FOV IS STILL RAINBOW SIX 3 (EECAMFOV 48.1, EECAMASPECT 1.429). It looks right and has
#   not been measured. If the world swims against the HUD, measure it here first.
# - PCSX2_REMIX_EECAMMATFLIP exists because which way along the third row a game calls "forward"
#   cannot be read off the numbers. It is 0 for this title, settled by looking at the screen.
#
# Lighting is the open item now, not geometry: the image is washed out nearly to monochrome with
# blown highlights, which is exposure and tonemapping, not the camera.
